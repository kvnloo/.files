name: Oura BLE gestures (offline)

on:
  pull_request:
    paths:
      - "scripts/oura-gestures.py"
      - "tests/test_oura_gestures.py"
      - "config/oura-gestures/**"
      - ".github/workflows/oura-gestures.yml"
  push:
    branches: [dev]
    paths:
      - "scripts/oura-gestures.py"
      - "tests/test_oura_gestures.py"
      - "config/oura-gestures/**"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check pytest cryptography
      - run: python -m py_compile scripts/oura-gestures.py
      - run: python -m pytest -q tests/test_oura_gestures.py
