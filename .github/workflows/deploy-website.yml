name: Deploy Production and Dev Websites to GitHub Pages

on:
  push:
    branches: [master, dev]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: master
          path: production

      - name: Checkout dev preview
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            production/website/package-lock.json
            preview/website/package-lock.json

      - name: Build production website
        working-directory: production/website
        run: npm ci && npm run build

      - name: Build dev preview
        working-directory: preview/website
        env:
          NEXT_PUBLIC_BASE_PATH: /.files/dev
        run: npm ci && npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/dev
          cp -a production/website/out/. site/
          cp -a preview/website/out/. site/dev/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
