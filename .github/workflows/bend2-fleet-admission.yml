name: Bend2 fleet admission law (draft verification)

on:
  pull_request:
    paths:
      - scripts/fleet
      - scripts/fleet-build
      - scripts/fleet_admission.py
      - config/fleet/nodes.yaml
      - bend/fleet_admission/**
      - tests/test_fleet_admission.py
      - tests/fleet_admission_*.py
      - .github/workflows/bend2-fleet-admission.yml

permissions:
  contents: read

concurrency:
  group: fleet-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verified-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap official Bend and Lean archives (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v zstd
          bash bend/fleet_admission/bootstrap.sh "$RUNNER_TEMP/admission-toolchain"
          echo "BEND=$RUNNER_TEMP/admission-toolchain/bend/bin/bend" >> "$GITHUB_ENV"
          echo "LEAN_BIN=$RUNNER_TEMP/admission-toolchain/lean-4.34.0-linux/bin" >> "$GITHUB_ENV"
      - name: Real kernel verdict, 96-state parity and isolated host fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/admission-venv"
          source "$RUNNER_TEMP/admission-venv/bin/activate"
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python -m unittest discover -s tests -p 'test_fleet_admission.py' -v
          python tests/fleet_admission_parity.py
          python tests/fleet_admission_mutation.py
