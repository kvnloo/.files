# Blue Snowball USB mic (WirePlumber 0.5)
#
# ACP leaves this card Active Profile: off, so Pulse has no capture source
# (OMP /live: "PulseAudio open failed: No such entity"). Force the mono
# input profile and prefer it over the onboard analog source.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-BLUE_MICROPHONE_Blue_Snowball*"
      }
    ]
    actions = {
      update-props = {
        device.profile = "input:mono-fallback"
        api.acp.auto-profile = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Blue Snowball"
        priority.session = 2100
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
