# Ctrl+Alt+Space is an explicit global recovery chord to the safe Insert base.
[control+alt]
space = clear()

[normal+control+alt]
space = clear()
i = C-A-i

[normal+meta+shift]
i = M-S-i

[normal+control+shift]
i = C-S-i

[normal+alt+shift]
i = A-S-i
