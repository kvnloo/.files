# Global Normal/Insert state for the Wooting 60HE keyboard only.
# Unmatched events are left to keyd's default pass-through; there is no catchall.
[global]
# Double-tap window for Esc Esc and Ctrl Ctrl.
oneshot_timeout = 350
# A key held this long and released alone is a hold, not a tap (Ctrl+click, Ctrl+scroll).
# Applies to every overloaded key: Caps (Esc), Super (cheatsheet) and Ctrl.
overload_tap_timeout = 300

[ids]
k:31e3:1312:629432a5

# Insert is the base state, so fresh boots and service restarts remain safe for
# ordinary typing. Escape enters the persistent Normal layer.
[main]
# Esc always reaches the focused app. A second Esc within the one-shot window enters Normal.
esc = oneshotm(escarm, esc)
# Tap-only sentinels for the cheatsheet; chords retain their Super modifier.
leftmeta = overload(meta, f13)
rightmeta = overload(meta, f14)
# Caps in Insert is Escape: a tap sends Esc to the app, a second tap (or Esc) within the
# one-shot window enters Normal. Held, it is Super.
capslock = overload(meta, oneshotm(escarm, esc))
# Ctrl Ctrl (either Ctrl key, tapped twice with nothing between) summons Carly on the whole
# desktop. Ctrl stays a plain Control: a tap still sends Control down/up to the focused app, so
# Tern's own double tap keeps working. The first clean tap arms ctrlarm for oneshot_timeout.
leftcontrol = overload(control, oneshot(ctrlarm))
rightcontrol = overload(control, oneshot(ctrlarm))

# Global Normal mode: only explicitly listed standard typing keys are blocked.
# The Fn key and all unlisted firmware outputs remain untouched/pass-through.
[escarm]
esc = toggle(normal)
capslock = toggle(normal)

# Second clean Ctrl tap inside the one-shot window: F15 is the sentinel Hyprland binds
# (code:193). Ctrl held with another key here is an ordinary chord and sends no F15.
[ctrlarm]
leftcontrol = overload(control, f15)
rightcontrol = overload(control, f15)

# Shift+Caps is the real Caps Lock. Needs caps:super off for keyd's virtual keyboard in Hyprland.
[shift]
capslock = capslock

[normal]
esc = esc
# Caps in Normal is Super only.
capslock = layer(meta)
i = toggle(normal)
h = M-h
j = M-j
k = M-k
l = M-l

