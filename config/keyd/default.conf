# Global Normal/Insert state for the Wooting 60HE keyboard only.
# Unmatched events are left to keyd's default pass-through; there is no catchall.
[ids]
k:31e3:1312:629432a5

# Insert is the base state, so fresh boots and service restarts remain safe for
# ordinary typing. Escape enters the persistent Normal layer.
[main]
esc = toggle(normal)
capslock = layer(meta)

# Global Normal mode: only explicitly listed standard typing keys are blocked.
# The Fn key and all unlisted firmware outputs remain untouched/pass-through.
[normal]
esc = esc
capslock = overloadt2(meta, esc, 200)
i = toggle(normal)
h = M-h
j = M-j
k = M-k
l = M-l

a = noop
b = noop
c = noop
d = noop
e = noop
f = noop
g = noop
m = noop
n = noop
o = noop
p = noop
q = noop
r = noop
s = noop
t = noop
u = noop
v = noop
w = noop
x = noop
y = noop
z = noop

1 = noop
2 = noop
3 = noop
4 = noop
5 = noop
6 = noop
7 = noop
8 = noop
9 = noop
0 = noop
minus = noop
equal = noop
leftbrace = noop
rightbrace = noop
backslash = noop
semicolon = noop
apostrophe = noop
grave = noop
comma = noop
dot = noop
slash = noop
space = noop
enter = noop

# Shift+i is not the plain i mode switch and must not type in Normal.
[normal+shift]
i = noop

# Keep ordinary Super/Caps chords available in Normal. This preserves the
# existing Super+Enter action, Super+Shift+Enter, held-Super cheatsheet, and
# all other compositor/app Super shortcuts. Physical Super remains distinct
# from Caps: only Caps has the contextual tap/hold behavior above.
[normal+meta]
a = M-a
b = M-b
c = M-c
d = M-d
e = M-e
f = M-f
g = M-g
h = M-h
i = M-i
j = M-j
k = M-k
l = M-l
