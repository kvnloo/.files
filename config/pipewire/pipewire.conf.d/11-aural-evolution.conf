# One stable sink. This is the boot fallback; the controller atomically swaps
# one compact adapter graph per variant, never parallel audition graphs.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ ifexists nofail ]
    args = {
      node.description = "Aural Evolution"
      media.name = "Aural Evolution"
      audio.channels = 2
      audio.position = [ FL FR ]
      filter.graph = {
        nodes = [
          # Active headphone correction. No loudness, compressor, or limiter.
          { type = builtin name = autoeq_l label = convolver config = {
              blocksize = 256 tailsize = 16384 channel = 0
              filename = [
                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
              ]
          } }
          { type = builtin name = autoeq_r label = convolver config = {
              blocksize = 256 tailsize = 16384 channel = 1
              filename = [
                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
              ]
          } }

          # Liked legacy boot seed. Runtime candidates cancel these controls,
          # then apply exact per-candidate K-weighted trim with ample headroom.
          { type = builtin name = pre_l      label = bq_highshelf control = { "Freq" = 0    "Q" = 1.0 "Gain" = -8.0 } }
          { type = builtin name = bass_l     label = bq_lowshelf  control = { "Freq" = 105  "Q" = 0.7 "Gain" =  0.8 } }
          { type = builtin name = body_l     label = bq_peaking   control = { "Freq" = 250  "Q" = 0.7 "Gain" =  0.3 } }
          { type = builtin name = presence_l label = bq_peaking   control = { "Freq" = 2800 "Q" = 0.7 "Gain" = -0.2 } }
          { type = builtin name = clarity_l  label = bq_peaking   control = { "Freq" = 5200 "Q" = 1.0 "Gain" =  0.0 } }
          { type = builtin name = pre_r      label = bq_highshelf control = { "Freq" = 0    "Q" = 1.0 "Gain" = -8.0 } }
          { type = builtin name = bass_r     label = bq_lowshelf  control = { "Freq" = 105  "Q" = 0.7 "Gain" =  0.8 } }
          { type = builtin name = body_r     label = bq_peaking   control = { "Freq" = 250  "Q" = 0.7 "Gain" =  0.3 } }
          { type = builtin name = presence_r label = bq_peaking   control = { "Freq" = 2800 "Q" = 0.7 "Gain" = -0.2 } }
          { type = builtin name = clarity_r  label = bq_peaking   control = { "Freq" = 5200 "Q" = 1.0 "Gain" =  0.0 } }

          { type = builtin name = copy_l label = copy }
          { type = builtin name = copy_r label = copy }
          # Native has no added delay; room mode matches R02's ~1.3 ms direct arrival.
          { type = builtin name = dry_l label = delay
            config = { "max-delay" = 0.005 "latency" = 0.001315 }
            control = { "Delay (s)" = 0.0 } }
          { type = builtin name = dry_r label = delay
            config = { "max-delay" = 0.005 "latency" = 0.001315 }
            control = { "Delay (s)" = 0.0 } }

          # R02 keeps the direct and early spatial field. About 90 ms retains
          # externalization cues without dragging the late room into music.
          { type = builtin name = brir_fl_l label = convolver config = {
              filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"
              channel = 0 length = 4096 blocksize = 256 tailsize = 8192
              gain = 0.64 latency = 0.001315 resample_quality = 14
          } }
          { type = builtin name = brir_fl_r label = convolver config = {
              filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"
              channel = 1 length = 4096 blocksize = 256 tailsize = 8192
              gain = 0.64 latency = 0.001315 resample_quality = 14
          } }
          { type = builtin name = brir_fr_l label = convolver config = {
              filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"
              channel = 2 length = 4096 blocksize = 256 tailsize = 8192
              gain = 0.64 latency = 0.001315 resample_quality = 14
          } }
          { type = builtin name = brir_fr_r label = convolver config = {
              filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"
              channel = 3 length = 4096 blocksize = 256 tailsize = 8192
              gain = 0.64 latency = 0.001315 resample_quality = 14
          } }
          { type = builtin name = room_l label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
          { type = builtin name = room_r label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
          # Native seed: exact dry path. Room variants change only these gains.
          { type = builtin name = mix_l label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
          { type = builtin name = mix_r label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
        ]
        links = [
          { output = "autoeq_l:Out" input = "pre_l:In" }
          { output = "pre_l:Out" input = "bass_l:In" }
          { output = "bass_l:Out" input = "body_l:In" }
          { output = "body_l:Out" input = "presence_l:In" }
          { output = "presence_l:Out" input = "clarity_l:In" }
          { output = "clarity_l:Out" input = "copy_l:In" }
          { output = "autoeq_r:Out" input = "pre_r:In" }
          { output = "pre_r:Out" input = "bass_r:In" }
          { output = "bass_r:Out" input = "body_r:In" }
          { output = "body_r:Out" input = "presence_r:In" }
          { output = "presence_r:Out" input = "clarity_r:In" }
          { output = "clarity_r:Out" input = "copy_r:In" }

          { output = "copy_l:Out" input = "dry_l:In" }
          { output = "copy_r:Out" input = "dry_r:In" }
          { output = "dry_l:Out" input = "mix_l:In 1" }
          { output = "dry_r:Out" input = "mix_r:In 1" }
          { output = "copy_l:Out" input = "brir_fl_l:In" }
          { output = "copy_l:Out" input = "brir_fl_r:In" }
          { output = "copy_r:Out" input = "brir_fr_l:In" }
          { output = "copy_r:Out" input = "brir_fr_r:In" }
          { output = "brir_fl_l:Out" input = "room_l:In 1" }
          { output = "brir_fr_l:Out" input = "room_l:In 2" }
          { output = "brir_fl_r:Out" input = "room_r:In 1" }
          { output = "brir_fr_r:Out" input = "room_r:In 2" }
          { output = "room_l:Out" input = "mix_l:In 2" }
          { output = "room_r:Out" input = "mix_r:In 2" }
        ]
        inputs = [ "autoeq_l:In" "autoeq_r:In" ]
        outputs = [ "mix_l:Out" "mix_r:Out" ]
      }
      capture.props = {
        node.name = "effect_input.aural_evolution"
        node.virtual = true
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
        resample.quality = 14
      }
      playback.props = {
        node.name = "effect_output.aural_evolution"
        target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
        node.passive = true
        stream.dont-remix = true
        audio.channels = 2
        audio.position = [ FL FR ]
        resample.quality = 14
      }
    }
  }
]
