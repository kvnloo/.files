# PipeWire Native Filter-Chain DSP for Headphones
#
# Four virtual sinks for easy A/B/C/D comparison:
#
#   "Headphone DSP"            → AutoEQ → Loudness Comp → MBC → Limiter (clean, no spatial)
#   "Headphone DSP + Crossfeed"→ AutoEQ → bs2b Crossfeed → Loudness Comp → MBC → Limiter
#   "Headphone DSP + Room"     → AutoEQ → BRIR True Stereo → Loudness Comp → MBC → Limiter
#   "Headphone DSP Movie"      → 7.1/5.1 fold-down → AutoEQ → Limiter
#
#   MBC = GentleDynamics Bark-scale multiband compressor (fatigue reduction)
#
# Switch between them:
#   wpctl status            (find the sink IDs)
#   wpctl set-default <id>  (switch active sink)
#   ~/workspace/.files/config/pipewire/headphone-switch.sh [clean|crossfeed|room]
#
# Prerequisites (Ubuntu):
#   sudo apt install lsp-plugins-lv2 zam-plugins bs2b-ladspa
#
# Activation:
#   1. Symlink this file to ~/.config/pipewire/pipewire.conf.d/
#   2. systemctl --user restart pipewire
#   3. wpctl set-default <headphone-dsp-node-id>
#
# Verification:
#   pw-top  (check XRUN=0, correct RATE and FORMAT)

context.modules = [

    # ═══════════════════════════════════════════════════════════════════════
    # Sink 1: Headphone DSP (clean — no room simulation)
    #   AutoEQ Convolver → LSP Loudness Comp → GentleDynamics MBC → Limiter
    # ═══════════════════════════════════════════════════════════════════════
    {
        name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        args = {
            node.description = "Headphone DSP"
            media.name       = "Headphone DSP"

            filter.graph = {
                nodes = [
                    # ── AutoEQ Convolver (minimum-phase frequency correction) ──
                    #
                    # Uses active_*.wav symlinks — switch headphones with:
                    #   headphone-switch.sh eq monarch   (Monarch MKII)
                    #   headphone-switch.sh eq hd800s    (HD800S)
                    {
                        type = builtin  name = eq_l  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 0
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }
                    {
                        type = builtin  name = eq_r  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 1
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }

                    # ── LSP Loudness Compensator (ISO 226:2003) ──
                    {
                        type   = lv2
                        name   = loudness
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            enabled = 1
                            std     = 1
                            fft     = 4
                            volume  = 0.0
                            input   = 1.0
                            hclip   = 0
                        }
                    }

                    # ── GentleDynamics Bark-scale MBC (fatigue reduction) ──
                    #
                    # 8-band multiband compressor aligned to perceptual Bark scale.
                    # All thresholds/gains in LINEAR gain (not dB). Ratio via cr_N.
                    #   Bands 0,6,7 = upward (gentle lift of quiet detail)
                    #   Bands 1-5   = downward (tame peaks causing fatigue)
                    #
                    # Currently BYPASSED — reconnect links to enable:
                    #   loudness → mbc → limiter (instead of loudness → limiter)
                    {
                        type   = lv2
                        name   = mbc
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            # Split frequencies (Bark scale, Hz)
                            sf_1 = 100   sf_2 = 200   sf_3 = 400   sf_4 = 800
                            sf_5 = 1600  sf_6 = 3200  sf_7 = 8000

                            # Band 0 (20-100 Hz): Upward — gentle sub-bass lift
                            ce_0 = 1  cm_0 = 1  al_0 = 0.010  at_0 = 100.0  cr_0 = 1.15  rt_0 = 300.0  kn_0 = 1.000  mk_0 = 1.0
                            # Band 1 (100-200 Hz): Downward — tame bass boom
                            ce_1 = 1  cm_1 = 0  al_1 = 0.100  at_1 = 60.0   cr_1 = 1.85  rt_1 = 200.0  kn_1 = 0.251  mk_1 = 1.0
                            # Band 2 (200-400 Hz): Downward — reduce mud
                            ce_2 = 1  cm_2 = 0  al_2 = 0.126  at_2 = 40.0   cr_2 = 1.65  rt_2 = 160.0  kn_2 = 0.398  mk_2 = 1.0
                            # Band 3 (400-800 Hz): Downward — control honk
                            ce_3 = 1  cm_3 = 0  al_3 = 0.158  at_3 = 30.0   cr_3 = 1.55  rt_3 = 140.0  kn_3 = 0.501  mk_3 = 1.0
                            # Band 4 (800-1600 Hz): Downward — ease presence fatigue
                            ce_4 = 1  cm_4 = 0  al_4 = 0.178  at_4 = 25.0   cr_4 = 1.45  rt_4 = 120.0  kn_4 = 0.631  mk_4 = 1.0
                            # Band 5 (1600-3200 Hz): Downward — reduce harshness
                            ce_5 = 1  cm_5 = 0  al_5 = 0.200  at_5 = 20.0   cr_5 = 1.35  rt_5 = 100.0  kn_5 = 0.708  mk_5 = 1.0
                            # Band 6 (3200-8000 Hz): Upward — recover air/detail
                            ce_6 = 1  cm_6 = 1  al_6 = 0.040  at_6 = 10.0   cr_6 = 1.06  rt_6 = 80.0   kn_6 = 0.631  mk_6 = 1.0
                            # Band 7 (8000+ Hz): Upward — subtle sparkle
                            ce_7 = 1  cm_7 = 1  al_7 = 0.020  at_7 = 5.0    cr_7 = 1.04  rt_7 = 60.0   kn_7 = 1.000  mk_7 = 1.0
                        }
                    }

                    # ── ZaMaximX2 Safety Limiter ──
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "urn:zamaudio:ZaMaximX2"
                        control = {
                            thresh = -0.3
                            rel    = 25.0
                        }
                    }
                ]

                links = [
                    { output = "eq_l:Out"        input = "loudness:in_l" }
                    { output = "eq_r:Out"        input = "loudness:in_r" }
                    { output = "loudness:out_l"  input = "mbc:in_l" }
                    { output = "loudness:out_r"  input = "mbc:in_r" }
                    { output = "mbc:out_l"       input = "limiter:lv2_audio_in_1" }
                    { output = "mbc:out_r"       input = "limiter:lv2_audio_in_2" }
                ]

                inputs  = [ "eq_l:In" "eq_r:In" ]
                outputs = [ "limiter:lv2_audio_out_1" "limiter:lv2_audio_out_2" ]
            }

            capture.props = {
                node.name   = "effect_input.headphone_dsp"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }

            playback.props = {
                node.name    = "effect_output.headphone_dsp"
                node.passive = true
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # Sink 2: Headphone DSP + Crossfeed (bs2b stereo-to-binaural)
    #   AutoEQ Convolver → bs2b Crossfeed → LSP Loudness Comp → MBC → Limiter
    #
    #   Classic Jan Meier preset: 700 Hz cutoff, 4.5 dB feeding level.
    #   Clean spatial cue without room reflections — middle ground between
    #   pure stereo and full BRIR room simulation.
    # ═══════════════════════════════════════════════════════════════════════
    {
        name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        args = {
            node.description = "Headphone DSP + Crossfeed"
            media.name       = "Headphone DSP + Crossfeed"

            filter.graph = {
                nodes = [
                    # ── AutoEQ Convolver ──
                    {
                        type = builtin  name = eq_l  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 0
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }
                    {
                        type = builtin  name = eq_r  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 1
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }

                    # ── bs2b Crossfeed (700 Hz / 4.5 dB — Jan Meier preset) ──
                    {
                        type    = ladspa
                        name    = bs2b
                        plugin  = bs2b
                        label   = bs2b
                        control = {
                            "Lowpass filter cut frequency (Hz)" = 700
                            "Feeding level (dB)" = 4.5
                        }
                    }

                    # ── LSP Loudness Compensator (ISO 226:2003) ──
                    {
                        type   = lv2
                        name   = loudness
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            enabled = 1
                            std     = 1
                            fft     = 4
                            volume  = 0.0
                            input   = 1.0
                            hclip   = 0
                        }
                    }

                    # ── GentleDynamics Bark-scale MBC (fatigue reduction) ──
                    # Currently BYPASSED — reconnect links to enable
                    {
                        type   = lv2
                        name   = mbc
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            sf_1 = 100   sf_2 = 200   sf_3 = 400   sf_4 = 800
                            sf_5 = 1600  sf_6 = 3200  sf_7 = 8000
                            ce_0 = 1  cm_0 = 1  al_0 = 0.010  at_0 = 100.0  cr_0 = 1.15  rt_0 = 300.0  kn_0 = 1.000  mk_0 = 1.0
                            ce_1 = 1  cm_1 = 0  al_1 = 0.100  at_1 = 60.0   cr_1 = 1.85  rt_1 = 200.0  kn_1 = 0.251  mk_1 = 1.0
                            ce_2 = 1  cm_2 = 0  al_2 = 0.126  at_2 = 40.0   cr_2 = 1.65  rt_2 = 160.0  kn_2 = 0.398  mk_2 = 1.0
                            ce_3 = 1  cm_3 = 0  al_3 = 0.158  at_3 = 30.0   cr_3 = 1.55  rt_3 = 140.0  kn_3 = 0.501  mk_3 = 1.0
                            ce_4 = 1  cm_4 = 0  al_4 = 0.178  at_4 = 25.0   cr_4 = 1.45  rt_4 = 120.0  kn_4 = 0.631  mk_4 = 1.0
                            ce_5 = 1  cm_5 = 0  al_5 = 0.200  at_5 = 20.0   cr_5 = 1.35  rt_5 = 100.0  kn_5 = 0.708  mk_5 = 1.0
                            ce_6 = 1  cm_6 = 1  al_6 = 0.040  at_6 = 10.0   cr_6 = 1.06  rt_6 = 80.0   kn_6 = 0.631  mk_6 = 1.0
                            ce_7 = 1  cm_7 = 1  al_7 = 0.020  at_7 = 5.0    cr_7 = 1.04  rt_7 = 60.0   kn_7 = 1.000  mk_7 = 1.0
                        }
                    }

                    # ── ZaMaximX2 Safety Limiter ──
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "urn:zamaudio:ZaMaximX2"
                        control = {
                            thresh = -0.3
                            rel    = 25.0
                        }
                    }
                ]

                links = [
                    { output = "eq_l:Out"        input = "bs2b:Input left" }
                    { output = "eq_r:Out"        input = "bs2b:Input right" }
                    { output = "bs2b:Output left"  input = "loudness:in_l" }
                    { output = "bs2b:Output right" input = "loudness:in_r" }
                    { output = "loudness:out_l"  input = "mbc:in_l" }
                    { output = "loudness:out_r"  input = "mbc:in_r" }
                    { output = "mbc:out_l"       input = "limiter:lv2_audio_in_1" }
                    { output = "mbc:out_r"       input = "limiter:lv2_audio_in_2" }
                ]

                inputs  = [ "eq_l:In" "eq_r:In" ]
                outputs = [ "limiter:lv2_audio_out_1" "limiter:lv2_audio_out_2" ]
            }

            capture.props = {
                node.name   = "effect_input.headphone_dsp_crossfeed"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }

            playback.props = {
                node.name    = "effect_output.headphone_dsp_crossfeed"
                node.passive = true
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # Sink 3: Headphone DSP + Room (with BRIR spatial simulation)
    #   AutoEQ Convolver → ASH BRIR True Stereo → LSP Loudness Comp → MBC → Limiter
    # ═══════════════════════════════════════════════════════════════════════
    {
        name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        args = {
            node.description = "Headphone DSP + Room"
            media.name       = "Headphone DSP + Room"

            filter.graph = {
                nodes = [
                    # ── AutoEQ Convolver ──
                    {
                        type = builtin  name = eq_l  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 0
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }
                    {
                        type = builtin  name = eq_r  label = convolver
                        config = {
                            blocksize = 256  tailsize = 16384  gain = 1.0  delay = 0  channel = 1
                            filename = [
                                "/home/kvn/workspace/.files/config/autoeq/active_44100Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_48000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_96000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_192000Hz.wav"
                                "/home/kvn/workspace/.files/config/autoeq/active_384000Hz.wav"
                            ]
                        }
                    }

                    # ── ASH BRIR True Stereo (binaural room simulation) ──
                    #
                    # R02 = WDR Broadcast Control Room (RT60 0.235s, most accurate)
                    # R32 = ASH Listening Room (RT60 0.35s, more spacious)
                    # To switch rooms, change the filename below.
                    #
                    { type = builtin  label = copy  name = copyFL }
                    { type = builtin  label = copy  name = copyFR }

                    { type = builtin  name = brir_fl_l  label = convolver
                      config = { filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"  channel = 0  blocksize = 256  tailsize = 65536  gain = 0.5 } }
                    { type = builtin  name = brir_fl_r  label = convolver
                      config = { filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"  channel = 1  blocksize = 256  tailsize = 65536  gain = 0.5 } }
                    { type = builtin  name = brir_fr_l  label = convolver
                      config = { filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"  channel = 2  blocksize = 256  tailsize = 65536  gain = 0.5 } }
                    { type = builtin  name = brir_fr_r  label = convolver
                      config = { filename = "/home/kvn/workspace/.files/config/brir/BRIR_R02_C1_True_Stereo.wav"  channel = 3  blocksize = 256  tailsize = 65536  gain = 0.5 } }

                    { type = builtin  label = mixer  name = mixL }
                    { type = builtin  label = mixer  name = mixR }

                    # ── LSP Loudness Compensator (ISO 226:2003) ──
                    {
                        type   = lv2
                        name   = loudness
                        plugin = "http://lsp-plug.in/plugins/lv2/loud_comp_stereo"
                        control = {
                            enabled = 1
                            std     = 1
                            fft     = 4
                            volume  = 0.0
                            input   = 1.0
                            hclip   = 0
                        }
                    }

                    # ── GentleDynamics Bark-scale MBC (fatigue reduction) ──
                    # Currently BYPASSED — reconnect links to enable
                    {
                        type   = lv2
                        name   = mbc
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            sf_1 = 100   sf_2 = 200   sf_3 = 400   sf_4 = 800
                            sf_5 = 1600  sf_6 = 3200  sf_7 = 8000
                            ce_0 = 1  cm_0 = 1  al_0 = 0.010  at_0 = 100.0  cr_0 = 1.15  rt_0 = 300.0  kn_0 = 1.000  mk_0 = 1.0
                            ce_1 = 1  cm_1 = 0  al_1 = 0.100  at_1 = 60.0   cr_1 = 1.85  rt_1 = 200.0  kn_1 = 0.251  mk_1 = 1.0
                            ce_2 = 1  cm_2 = 0  al_2 = 0.126  at_2 = 40.0   cr_2 = 1.65  rt_2 = 160.0  kn_2 = 0.398  mk_2 = 1.0
                            ce_3 = 1  cm_3 = 0  al_3 = 0.158  at_3 = 30.0   cr_3 = 1.55  rt_3 = 140.0  kn_3 = 0.501  mk_3 = 1.0
                            ce_4 = 1  cm_4 = 0  al_4 = 0.178  at_4 = 25.0   cr_4 = 1.45  rt_4 = 120.0  kn_4 = 0.631  mk_4 = 1.0
                            ce_5 = 1  cm_5 = 0  al_5 = 0.200  at_5 = 20.0   cr_5 = 1.35  rt_5 = 100.0  kn_5 = 0.708  mk_5 = 1.0
                            ce_6 = 1  cm_6 = 1  al_6 = 0.040  at_6 = 10.0   cr_6 = 1.06  rt_6 = 80.0   kn_6 = 0.631  mk_6 = 1.0
                            ce_7 = 1  cm_7 = 1  al_7 = 0.020  at_7 = 5.0    cr_7 = 1.04  rt_7 = 60.0   kn_7 = 1.000  mk_7 = 1.0
                        }
                    }

                    # ── ZaMaximX2 Safety Limiter ──
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "urn:zamaudio:ZaMaximX2"
                        control = {
                            thresh = -0.3
                            rel    = 25.0
                        }
                    }
                ]

                links = [

                    # AutoEQ → BRIR copy nodes
                    { output = "eq_l:Out"       input = "copyFL:In" }
                    { output = "eq_r:Out"       input = "copyFR:In" }

                    # Fan out to True Stereo BRIR convolvers
                    { output = "copyFL:Out"     input = "brir_fl_l:In" }
                    { output = "copyFL:Out"     input = "brir_fl_r:In" }
                    { output = "copyFR:Out"     input = "brir_fr_l:In" }
                    { output = "copyFR:Out"     input = "brir_fr_r:In" }

                    # Mix: Left ear = FL→L + FR→L, Right ear = FL→R + FR→R
                    { output = "brir_fl_l:Out"  input = "mixL:In 1" }
                    { output = "brir_fr_l:Out"  input = "mixL:In 2" }
                    { output = "brir_fl_r:Out"  input = "mixR:In 1" }
                    { output = "brir_fr_r:Out"  input = "mixR:In 2" }

                    { output = "mixL:Out"  input = "loudness:in_l" }
                    { output = "mixR:Out"  input = "loudness:in_r" }
                    { output = "loudness:out_l"  input = "mbc:in_l" }
                    { output = "loudness:out_r"  input = "mbc:in_r" }
                    { output = "mbc:out_l"  input = "limiter:lv2_audio_in_1" }
                    { output = "mbc:out_r"  input = "limiter:lv2_audio_in_2" }
                ]

                inputs  = [ "eq_l:In" "eq_r:In" ]
                outputs = [ "limiter:lv2_audio_out_1" "limiter:lv2_audio_out_2" ]
            }

            capture.props = {
                node.name   = "effect_input.headphone_dsp_room"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }

            playback.props = {
                node.name    = "effect_output.headphone_dsp_room"
                node.passive = true
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
                audio.channels = 2
                audio.position = [ FL FR ]
                resample.quality = 14
            }
        }
    }

    # ═══════════════════════════════════════════════════════════════════════
    # Sink 4: Headphone DSP Movie
    #   7.1/5.1 capture -> headroom-preserving stereo fold-down -> AutoEQ -> limiter
    #
    # This is intentionally cleaner than the music sinks:
    #   - no BRIR room layer: movie tracks already contain spatial/room cues
    #   - no loudness compensator: preserves theatrical dynamic range
    #   - no MBC: avoids reshaping dialogue, effects, and score balance
    #
    # Downmix coefficients are Lo/Ro-style with about 6 dB of headroom:
    #   L = 0.50 FL + 0.354 FC + 0.177 RL + 0.177 SL + 0.125 LFE
    #   R = 0.50 FR + 0.354 FC + 0.177 RR + 0.177 SR + 0.125 LFE
    # ═══════════════════════════════════════════════════════════════════════
    {
        name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        args = {
            node.description = "Headphone DSP Movie"
            media.name       = "Headphone DSP Movie"

            filter.graph = {
                nodes = [
                    { type = builtin  label = copy   name = copyFC }
                    { type = builtin  label = copy   name = copyLFE }

                    {
                        type = builtin  label = mixer  name = mixL
                        control = {
                            "Gain 1" = 0.500
                            "Gain 2" = 0.354
                            "Gain 3" = 0.177
                            "Gain 4" = 0.177
                            "Gain 5" = 0.125
                        }
                    }
                    {
                        type = builtin  label = mixer  name = mixR
                        control = {
                            "Gain 1" = 0.500
                            "Gain 2" = 0.354
                            "Gain 3" = 0.177
