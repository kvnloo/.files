# Route Plex Desktop Flatpak to the dedicated movie headphone sink.
#
# The movie sink accepts 7.1/5.1 input, folds it down with headroom, applies
# headphone AutoEQ, and skips the music-oriented BRIR/loudness/MBC stages.

pulse.rules = [
    {
        matches = [
            { application.name = "Plex" }
            { pipewire.access.portal.app_id = "tv.plex.PlexDesktop" }
        ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp_movie"
            }
        }
    }
]
