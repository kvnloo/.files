# Route browser audio to the stable evolutionary sink.
#
# Browsers connect via PulseAudio protocol (pipewire-pulse). This rule
# matches their streams and sets target.object so WirePlumber routes them
# to one sink while its native/room controls change in place.

pulse.rules = [
    {
        matches = [ { application.name = "Google Chrome" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
    {
        matches = [ { application.name = "Chromium" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
    {
        matches = [ { application.name = "Firefox" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
    {
        matches = [ { application.name = "Brave" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
]
