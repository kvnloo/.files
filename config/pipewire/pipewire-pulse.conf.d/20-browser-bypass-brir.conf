# Route browser audio to the clean DSP sink (AutoEQ only, no BRIR/crossfeed)
#
# Browsers connect via PulseAudio protocol (pipewire-pulse). This rule
# matches their streams and sets target.object so WirePlumber routes them
# to the "Headphone DSP" (clean) sink instead of whichever DSP+Room/Crossfeed
# sink is currently the default.
#
# This way Chrome/Firefox still get headphone EQ correction but skip the
# BRIR convolver that adds unwanted reverb/noise to browser audio.

pulse.rules = [
    {
        matches = [ { application.name = "Google Chrome" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
    {
        matches = [ { application.name = "Chromium" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
    {
        matches = [ { application.name = "Firefox" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
    {
        matches = [ { application.name = "Brave" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
]
