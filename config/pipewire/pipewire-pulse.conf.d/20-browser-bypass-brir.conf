# Route Google Chrome (including Netflix app windows) like Plex: Movie DSP.
# Chrome app windows share the browser's PulseAudio identity, so this applies
# to all Google Chrome audio. Other browsers retain the evolutionary sink.

pulse.rules = [
    {
        matches = [ { application.name = "Google Chrome" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp_movie"
            }
        }
    }
    {
        matches = [ { application.name = "Chromium" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
    {
        matches = [ { application.name = "Firefox" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
    {
        matches = [ { application.name = "Brave" } ]
        actions = {
            update-props = {
                target.object = "effect_input.aural_evolution"
            }
        }
    }
]
