# Route Oh My Pi /live playback to the clean headphone DSP sink.
#
# Default sink is often Headphone DSP + Room (BRIR). OMP AudioPlayback opens
# Pulse default with 24 kHz mono PCM and has no app-level target, so live
# speech would otherwise go through room convolution. Browsers already bypass
# via 20-browser-bypass-brir.conf; this is the same pattern for omp.
#
# bun-launched omp (dotfiles wrapper) also sets PULSE_SINK; this rule covers
# the compiled `omp` binary and Pulse application.name matches.

pulse.rules = [
    {
        matches = [ { application.name = "omp" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
    {
        matches = [ { application.process.binary = "omp" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
    {
        matches = [ { application.name = "oh-my-pi" } ]
        actions = {
            update-props = {
                target.object = "effect_input.headphone_dsp"
            }
        }
    }
]
