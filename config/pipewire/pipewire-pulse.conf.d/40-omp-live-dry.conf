# Route Oh My Pi /live playback to the raw Topping DX5 sink (no DSP).
#
# Grok realtime is 24 kHz mono. Headphone DSP (AutoEQ + loudness + MBC) is
# built for music at 44.1–384 kHz and colors speech. Default sink may still
# be Headphone DSP + Room for music; this rule pins OMP only.
#
# bun-launched omp (wrapper) also sets PULSE_SINK to the same DX5 node.

pulse.rules = [
    {
        matches = [ { application.name = "oh-my-pi" } ]
        actions = {
            update-props = {
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
            }
        }
    }
    {
        matches = [ { media.name = "voice" } ]
        actions = {
            update-props = {
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
            }
        }
    }
    {
        matches = [ { application.name = "omp" } ]
        actions = {
            update-props = {
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
            }
        }
    }
    {
        matches = [ { application.process.binary = "omp" } ]
        actions = {
            update-props = {
                target.object = "alsa_output.usb-Topping_DX5-00.HiFi__Headphones__sink"
            }
        }
    }
]
