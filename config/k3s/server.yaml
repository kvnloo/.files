# K3s server config for the desktop (groot). setup-k3s.sh renders @TS_IP@ and
# installs the result as /etc/rancher/k3s/config.yaml. No secrets live here.
node-ip: "@TS_IP@"
advertise-address: "@TS_IP@"
# Pod traffic between nodes rides the tailnet, so no LAN or public exposure.
flannel-iface: tailscale0
tls-san:
  - "@TS_IP@"
  - "@HOSTNAME@"
# No ingress or LoadBalancer controller until a workload needs one.
disable:
  - traefik
  - servicelb
write-kubeconfig-mode: "0600"
node-label:
  - "z0.dev/role=server"
  - "z0.dev/gpu=rtx3080ti"
# groot's host budgets are not pods, so the kubelet must not offer their memory to
# the scheduler. Reserved = agent.slice MemoryMax (10Gi, agent.slice.d/
# 60-oomd-desktop-guard.conf) + z0-farm-llama MemoryHigh (6Gi) + desktop/session 4Gi.
# Allocatable ~2.4Gi covers control-plane pods (~0.8Gi requested) and small GPU
# jobs; bigger GPU work admits through groot-admit. tests/test_k3s_host_reservation.py
# fails when a host budget grows past this reservation.
kubelet-arg:
  - "system-reserved=cpu=2,memory=20Gi"
  - "eviction-hard=memory.available<1Gi"
# Images and cluster state live here, not on the root disk.
data-dir: "@K3S_DATA@"
