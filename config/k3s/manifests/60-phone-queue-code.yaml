            b = bounds(n)
            if not b or not (b[0] <= x <= b[2] and b[1] <= y <= b[3]):
                continue
            area = (b[2] - b[0]) * (b[3] - b[1])
            anyn.append((area, n))
            if n.get("clickable") == "true" or n.get("long-clickable") == "true":
