# factory: untrusted OSS contribution tests. Restricted pods, six-pod ceiling
#          (defense in depth; oss-factory owns worker claims).
# z0:      z0intelligence services and unsloth/GPU jobs (trusted, our code).
# lanes:   relay jobs that call free model APIs; CPU and network only.
apiVersion: v1
kind: Namespace
metadata:
  name: factory
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: z0
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: lanes
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: factory-ceiling
  namespace: factory
spec:
  hard:
    pods: "6"
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.memory: 16Gi
    requests.nvidia.com/gpu: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: factory-defaults
  namespace: factory
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 2Gi}
      defaultRequest: {cpu: 250m, memory: 512Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lanes-defaults
  namespace: lanes
spec:
  limits:
    - type: Container
      default: {cpu: 500m, memory: 512Mi}
      defaultRequest: {cpu: 50m, memory: 128Mi}
