# phone-queue: one front door for every agent that wants the S22+ / S25 Ultra
# (docs/fleet/phone-queue.md). Agents POST jobs to http://100.113.138.100:8792; the
# front door turns each job into a Kubernetes Job in ns "phones" that Kueue admits
# through LocalQueue phones -> ClusterQueue phones (config/k3s/kueue/phones.yaml):
# one z0.dev/phone slot per phone, so k3s runs one job per phone and queues the rest.
#
# Why hostNetwork + hostPath (privileged namespace, like fleet-mbp):
#   - groot's adb server listens on 127.0.0.1:5037 only, and the S22+ is on groot's USB;
#   - the UI mutexes /tmp/{s22,s25}-ui.lock are host flocks shared with
#     tern-queue-loop@s22, phone-worker ui and the overnight drivers;
#   - the drivers, gates and redaction are host code reused in place (read-only):
#     chatgpt-driver (burst.py, harvest.py, deepseek_burst.py, pace.py), phone-worker,
#     fleet-adb, phone-screen-safe, fx; uiautomator2 comes from the chatgpt-driver venv.
# Code is plain Python from ConfigMap phone-queue-code (60-phone-queue-code.yaml,
# generated by services/phone-queue/render-configmap), as factory-gateway does.
# Pods run as kvn (uid 1000), drop all capabilities, and mount the home read-only.
# Auth: Secret phone-queue-auth (tokens.json = sha256(token) -> principal, shim-key) is made by
# services/phone-queue/issue-tokens (setup-k3s.sh apply runs it); it is never committed. Without
# it the API refuses every write and the shim refuses every model call (fail closed).
# QoS Guaranteed (requests == limits on every container): a global groot OOM once killed this
# pod as burstable; Guaranteed pods are the kernel OOM killer's last choice.
apiVersion: v1
kind: ServiceAccount
metadata: {name: phone-queue, namespace: phones}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: phone-runner, namespace: phones}
automountServiceAccountToken: true
---
# Front door: create/watch/delete its own Jobs; read pods/logs and Kueue workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: phone-queue, namespace: phones}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: phone-queue, namespace: phones}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: phone-queue}
subjects: [{kind: ServiceAccount, name: phone-queue, namespace: phones}]
---
# Runner: reads only which flavor (phone) Kueue admitted its Workload on.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: phone-runner, namespace: phones}
rules:
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: phone-runner, namespace: phones}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: phone-runner}
subjects: [{kind: ServiceAccount, name: phone-runner, namespace: phones}]
---
# /healthz reports whether node groot still advertises z0.dev/phone (read-only).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: phone-queue-node-reader}
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [groot]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: phone-queue-node-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: phone-queue-node-reader}
subjects: [{kind: ServiceAccount, name: phone-queue, namespace: phones}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phone-queue
  namespace: phones
  labels: {app: phone-queue}
spec:
  replicas: 1
  strategy: {type: Recreate}   # host ports: never two front doors
  selector:
    matchLabels: {app: phone-queue}
  template:
    metadata:
      labels: {app: phone-queue}
    spec:
      serviceAccountName: phone-queue
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/hostname: groot}
      tolerations:
        - {key: z0.dev/host, operator: Equal, value: interactive, effect: PreferNoSchedule}
      terminationGracePeriodSeconds: 10   # both processes exit on SIGTERM at once
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # Secret files group-readable by kvn (mode 0440)
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: python:3.13.13-slim-trixie
          command: [python3, -u, /app/server.py]
          env:
            - {name: HOME, value: /home/kvn}
            - {name: PHONEQ_STATE, value: /mnt/zer0models/phone-queue/state}
            - {name: PHONEQ_PORT, value: "8792"}
            - {name: PHONEQ_BINDS, value: "127.0.0.1,100.113.138.100"}
            - {name: PHONEQ_IMAGE, value: python:3.13.13-slim-trixie}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          readinessProbe:
            tcpSocket: {port: 8792}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8792}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: 250m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: home, mountPath: /home/kvn, readOnly: true}
            - {name: zer0models, mountPath: /mnt/zer0models, readOnly: true}
            - {name: state, mountPath: /mnt/zer0models/phone-queue/state}
            - {name: tmp, mountPath: /tmp}
            - {name: hostproc, mountPath: /host/proc, readOnly: true}
            - {name: auth-api, mountPath: /etc/phoneq, readOnly: true}
        - name: model-shim
          # Hermes' own interpreter + source, exactly the dash-log-watch Luna path.
          image: python:3.13.13-slim-trixie
          command: [/home/kvn/.hermes/tools/python-3.14.7+20260901-linux-x64/bin/python3, -I, -u, /app/model_shim.py]
          env:
            - {name: HOME, value: /home/kvn}
            - {name: HERMES_HOME, value: /home/kvn/.hermes/profiles/clean}
            - {name: TMPDIR, value: /home/kvn/.hermes/profiles/clean/cache/scratch}
            - {name: PHONEQ_STATE, value: /mnt/zer0models/phone-queue/state}
            - {name: PHONEQ_SHIM_PORT, value: "8795"}
            - {name: PHONEQ_HERMES_SOURCE, value: /workspace/hermes-home/hermes-agent}
          readinessProbe:
            exec:
              command: [/home/kvn/.hermes/tools/python-3.14.7+20260901-linux-x64/bin/python3, -I, -c,
                        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8795/healthz', timeout=3)"]
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 768Mi}
            limits: {cpu: 500m, memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: home, mountPath: /home/kvn, readOnly: true}
            - {name: hermes, mountPath: /workspace/hermes-home, readOnly: true}
            - {name: hermes-clean, mountPath: /workspace/hermes-home/profiles/clean}
            # hermes_bootstrap takes its dependency-generation locks here on every start.
            - {name: hermes-installs, mountPath: /workspace/hermes-home/installs}
            - {name: state, mountPath: /mnt/zer0models/phone-queue/state}
            - {name: shimtmp, mountPath: /tmp}
            - {name: auth-shim, mountPath: /etc/phoneq, readOnly: true}
      volumes:
        - name: code
          configMap: {name: phone-queue-code, defaultMode: 0555}
        - {name: home, hostPath: {path: /home/kvn, type: Directory}}
        - {name: zer0models, hostPath: {path: /mnt/zer0models, type: Directory}}
        - {name: state, hostPath: {path: /mnt/zer0models/phone-queue/state, type: DirectoryOrCreate}}
        - {name: tmp, hostPath: {path: /tmp, type: Directory}}
        - {name: hostproc, hostPath: {path: /proc, type: Directory}}
        - {name: hermes, hostPath: {path: /workspace/hermes-home, type: Directory}}
        - {name: hermes-clean, hostPath: {path: /workspace/hermes-home/profiles/clean, type: Directory}}
        - {name: hermes-installs, hostPath: {path: /workspace/hermes-home/installs, type: Directory}}
        - {name: shimtmp, emptyDir: {sizeLimit: 256Mi}}
        - name: auth-api
          secret:
            secretName: phone-queue-auth
            optional: true
            defaultMode: 0440
            items: [{key: tokens.json, path: tokens.json}]
        - name: auth-shim
          secret:
            secretName: phone-queue-auth
            optional: true
            defaultMode: 0440
            items: [{key: shim-key, path: shim-key}]
