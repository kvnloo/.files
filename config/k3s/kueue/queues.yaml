# Kueue queues. A Job joins a queue by carrying the label
# kueue.x-k8s.io/queue-name=<LocalQueue name> in its own namespace.
# The fleet-mbp/lanes and lanes/lanes LocalQueues share one ClusterQueue budget.
#
# Parent-approved static memory budget after host drain and authorized tmpfs cleanup:
# 16630620160 total - 2147483648 reserve - 2837270528 frozen idle OS baseline
# - 1204051968 remaining Shmem = 10441814016 bytes, with NO GiB rounding.
# Idle OS baseline: anonymous memory + unreclaimable kernel + stacks/page tables
# + unevictable/per-CPU memory. Do not reclassify active job memory as idle OS.
# Allocatable 12046536Ki = 12335652864 bytes caps this static budget.
# This is NOT instantaneous MemAvailable admission. Recompute after measured changes.
# CPU budget = min(4 physical cores, 6.5 allocatable CPUs) = 4.
# Default fleet-build and --node mbp use Kueue; mbp-host must reserve here too.
# Host escapes must hold reservations for their full lifetime to share this budget.
# The GPU flavor pins GPU work to labelled nodes.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: cpu
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-rtx3080ti
spec:
  nodeLabels:
    z0.dev/gpu: rtx3080ti
---
# CPU work never spills to the interactive desktop. Kueue writes the flavor's
# nodeLabels into the admitted pod as a nodeSelector, so placement follows quota.
# Sizes come from measured factory jobs (oss-factory tools/factory/measurements.json):
# a discover job peaks under ~100 MiB and is network-bound, so `pods` is the binding
# limit, not CPU. Raise these when a node joins (one flavor per node).
# Each node flavor also carries the node's job-class labels (config/fleet/nodes.yaml,
# applied by `scripts/fleet labels`). Kueue only matches a Job's nodeSelector against
# keys a flavor names. node-mbp carries all three CPU job classes.
# node-groot never offers heavyweight CPU-only quota.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: node-mbp
spec:
  nodeLabels:
    kubernetes.io/hostname: mbp
    z0.dev/cpu-admit: "true"
    z0.dev/class-cpu-heavy: "true"
    z0.dev/class-build: "true"
    z0.dev/class-render: "true"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: node-groot
spec:
  nodeLabels:
    kubernetes.io/hostname: groot
    z0.dev/class-cpu-heavy: "false"
    z0.dev/class-build: "false"
    z0.dev/class-render: "true"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: factory
spec:
  namespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: factory}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: [cpu, memory, pods]
      flavors:
        - name: node-mbp
          # Migration hold: factory and lanes otherwise reserve MBP independently.
          # Restore only after an explicit shared-capacity plan and fresh sample.
          resources:
            - {name: cpu, nominalQuota: "0"}
            - {name: memory, nominalQuota: "0"}
            - {name: pods, nominalQuota: "16"}

---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: test}
value: 1000
description: Short tests ahead of builds and restart-safe benchmarks.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: build}
value: 100
description: Builds ahead of restart-safe benchmarks.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata: {name: bench}
value: 10
description: Checkpoint-safe benchmarks using idle lane capacity.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: lanes
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [lanes, fleet-mbp]
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: node-mbp
          resources:
            - {name: cpu, nominalQuota: "4"}
            - {name: memory, nominalQuota: "10441814016"}
---
# z0: our own services and GPU jobs. One exclusive GPU; GPU Jobs queue for it
# instead of failing to schedule.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: z0
spec:
  namespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: z0}
  queueingStrategy: StrictFIFO
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: cpu
          resources:
            - {name: cpu, nominalQuota: "8"}
            - {name: memory, nominalQuota: 12Gi}
    - coveredResources: [nvidia.com/gpu]
      flavors:
        - name: gpu-rtx3080ti
          resources:
            - {name: nvidia.com/gpu, nominalQuota: "1"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: factory, namespace: factory}
spec: {clusterQueue: factory}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: lanes, namespace: lanes}
spec: {clusterQueue: lanes}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: lanes, namespace: fleet-mbp}
spec: {clusterQueue: lanes}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: z0, namespace: z0}
spec: {clusterQueue: z0}
