<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Keep compositor startup independent of the host's large/custom font catalog. -->
<fontconfig>
  <dir>/usr/share/fonts/Adwaita</dir>
  <dir>/usr/share/fonts/liberation</dir>
  <cachedir>/run/user/1000/agent-display/font-cache</cachedir>
</fontconfig>
