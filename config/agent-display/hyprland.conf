# On-demand agent display. Never route probes to physical workspaces 1, 2 or 8.
monitor = AGENT-1, 1440x1000@60, 10000x10000, 1
workspace = name:agent, monitor:AGENT-1, default:true
windowrule = match:class ^(sway|wlroots)$, workspace name:agent silent
windowrule = match:class ^(sway|wlroots)$, no_initial_focus on
windowrule = match:class ^(sway|wlroots)$, no_focus on
windowrule = match:class ^(sway|wlroots)$, float on
windowrule = match:class ^(sway|wlroots)$, size 1440 1000
windowrule = match:class ^(sway|wlroots)$, move 0 0
