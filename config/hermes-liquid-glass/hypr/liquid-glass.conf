# Hermes Liquid Glass — Hyprland fragment
# Source from hyprland.conf:
#   source = ~/workspace/.files/config/hermes-liquid-glass/hypr/liquid-glass.conf
#
# Requires decoration:blur { ignore_opacity = true } for real frost (not muddy fade).

# Compositor alpha (Electron has no Linux setOpacity). Active / inactive.
windowrule = match:class ^(Hermes)$, opacity 0.78 0.72
