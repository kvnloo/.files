# NOTE: Do NOT set CLAUDE_CONFIG_DIR here.
#
# ccusage (used by tokenmaxxing) supports a comma-separated multi-dir list, but
# Claude Code itself expects a single config directory — exporting a multi-dir
# list breaks `claude` auth ("Not logged in").
#
# Multi-profile aggregation is applied only when running tokenmaxxing:
#   - interactive: zsh function in config/zsh/aliases.zsh
#   - scheduled:   systemd drop-in tokenmaxxing-sync.service.d/claude-profiles.conf
#   - service:     export in ~/.config/tokenmaxxing/tokenmaxxing.sh
