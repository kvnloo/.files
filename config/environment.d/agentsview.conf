# AgentsView keeps ~/.agentsview as a symlink onto the 4 TB volume because $HOME
# is full. AgentsView v0.39 refuses a symlinked runtime dir ("prepare runtime
# dir: /home/kvn/.agentsview is a symlink"), which made every entry point fail
# (mcp tool calls, `session search`, `daemon status`).
#
# Pointing DATA_DIR at the real path fixes it without moving or copying the 21 GB
# corpus. Verified: daemon starts, `session search` returns matches, and the MCP
# search_sessions tool answers in ~250 ms.
AGENTSVIEW_DATA_DIR=/mnt/zer0models/sft-svlm/data/agentsview
