# Fleet registry: the one place that says which tailnet devices take work and how.
# Read by scripts/fleet (on groot). No secrets here; tailnet IPs are not secrets.
#
# role:      server | worker
# ssh:       host lane access as the locked-down `agentjob` user (key-only sshd on
#            port 2222, reachable on tailscale0 from the controller only)
# classes:   job classes this node accepts. scripts/fleet labels writes them as node
#            labels z0.dev/class-<name>=true|false (every class, every node) and
#            config/k3s/kueue/queues.yaml copies them into the node's flavor.
# capabilities: host toolchains a `fleet run` job finds on the node (not k3s pods).
#            `fleet run --class X` matches classes or capabilities, so
#            `--class android-build` lands on a node that can run ./gradlew assemble*.
#            `fleet labels` mirrors them as node labels z0.dev/cap-<name>=true|false.
# toolchains: what `fleet toolchain <node>` (and `fleet enroll`) installs there with
#            scripts/fleet-toolchain.sh: jdk17 jdk21 bun android-sdk.
# health:    thresholds for `fleet health`; on_unhealthy: cordon | report
# lane:      limits for host jobs (`fleet run`): the agentjob user slice is capped at
#            mem_max/cpu_quota; a job only starts when MemAvailable >= mem_floor_mb
#            plus the job's own --mem.
# aliases:   other names scripts/fleet accepts for the node (`fleet run s22 ...`).
defaults:
  health:
    min_mem_available_mb: 1024
    min_disk_free_gb: 15
    max_temp_c: 95
    min_battery_pct_on_battery: 40
    strikes: 2            # consecutive bad checks before cordon; same count of good ones to uncordon
    on_unhealthy: cordon
  lane:
    mem_floor_mb: 2048
    default_mem: 2G
    mem_max: 4G
    cpu_quota: 600%
    tasks_max: 4096

classes: [cpu-heavy, build, render]

nodes:
  boat:
    role: worker
    kind: boat
    arch: amd64
    classes: [build, cpu-heavy]
    capabilities: [python, git, x86]
    taints: [cloud]         # Explicit --node boat or fleet-build --public overflow only.
    health:
      on_unhealthy: report
    lane:
      default_mem: 512M
      mem_max: 7G
      mem_floor_mb: 0
  mbp:
    role: worker
    tailnet_ip: 100.78.215.21
    ssh_port: 2222
    arch: amd64
    classes: [cpu-heavy, build, render]
    # Default builds and --node mbp retain the existing host backend.
    # Kueue is opt-in only: --node k3s-mbp, namespace fleet-mbp,
    # LocalQueue lanes -> ClusterQueue lanes. Its quotas live in
    # config/k3s/kueue/queues.yaml, separate from this host-lane ceiling.
    # Hermes executor/quackles manifests belong in hermes-k8s-lab, not .files.
    # The parent migration retires kind only after the real k3s readiness proof.
    # SDK in /opt/android-sdk; Gradle caches in /home/agentjob/.gradle.
    capabilities: [android-build, jdk17, jdk21, bun, node, python, git]
    toolchains: [jdk17, jdk21, bun, android-sdk]
    lane:
      mem_max: 7G           # 16 GiB laptop; a NOOP debug build (Gradle + Kotlin daemons) wants ~5-6 GiB
      # 4 of 8 threads for all host jobs together: at 6 threads a NOOP build held the
      # i7-4870HQ at 96-98 C with both fans at max (crit 100 C), and health paused it.
      cpu_quota: 400%
    health:
      # Owner decision 2026-10-22: worn thermal paste keeps this i7-4870HQ near
      # 92-98 C under load. Do not pause on temperature; the CPU's own PROCHOT
      # throttling (TjMax 105 C) protects it. 110 sits above anything a probe can
      # report while still requiring a finite reading (missing data still holds).
      max_temp_c: 110
    kubelet:
      system_reserved: cpu=1,memory=2Gi
      kube_reserved: cpu=500m,memory=1Gi
      eviction_hard: memory.available<1Gi,nodefs.available<10%,imagefs.available<10%
      eviction_soft: memory.available<1536Mi
      eviction_soft_grace: memory.available=1m
      # Default reclaim (= the threshold, 10%) kept DiskPressure set until 20% free on a
      # 317 GiB btrfs disk; 2% clears it at 12%. Live since 2026-10-22 via the
      # owner-run drop-in /etc/rancher/k3s/config.yaml.d/60-eviction-reclaim.yaml.
      eviction_minimum_reclaim: imagefs.available=2%,nodefs.available=2%
  omarchy-phone:
    # Owner's S25 Ultra, Arch Linux ARM in Omalauncher's PRoot (no systemd, no
    # cgroups, no netlink/iptables): k3s cannot run, so host lane only, politely.
    # Owner-controlled light/worker profiles; live battery/thermal/RAM gates always win.
    role: worker
    kind: phone
    tailnet_ip: 100.104.42.85
    ssh_user: root          # PRoot fake root = the Omalauncher app's Android uid
    ssh_port: 22
    arch: arm64
    classes: [phone]
    capabilities: [python, git, java, node, bun, go, rust, cargo, gcc]
    taints: [phone]         # `fleet run` picks it only with --tolerate phone or --node
    model: SM-S938U
    phone_modes:
      light: {cpus: "0-1", slots: 1, memory_pct: 25}
      worker: {cpus: "0-5", slots: 6, memory_pct: 75, min_battery_pct: 2}
    phone_runtime:
      node: 24.21.0
      bun: 1.3.14
    phone_packages: [go, rust, gcc]
    android:                # groot's adb to the phone itself (fleet health; read-only)
      adb_host: 100.117.226.39   # Android Tailscale app IP; wireless-debugging port changes
      revive: false         # true: reopen Omalauncher when its service is gone and the screen is off
    health:
      min_mem_available_mb: 1200
      min_disk_free_gb: 5
      max_android_thermal_status: 1
      on_unhealthy: pause   # `fleet run` skips it; polite-run drains running jobs itself
    lane:
      mem_floor_mb: 1200
      default_mem: 512M
      mem_max: 8G
      cpus: 0-5
  galaxy-s22plus:
    # Spare Galaxy S22+ (SM-S906U1, Snapdragon 8 Gen 1: cores 0-3 are the small
    # ones), Arch Linux ARM in Omalauncher's PRoot like omarchy-phone. Its guest is
    # its own tailnet node `localhost-0`; the Android Tailscale app node
    # `galaxy-s22` (100.72.191.23) is the same phone. No Tailscale SSH in this
    # guest: key-only OpenSSH on 8022 (`ssh s22` on groot). Same polite lane,
    # Reserve core 7 for the launcher. Both profiles keep nice 19 and idle I/O.
    role: worker
    kind: phone
    aliases: [s22]
    tailnet_ip: 100.97.11.22
    ssh_user: root
    ssh_port: 8022
    arch: arm64
    classes: [phone]
    capabilities: [python, git, node, bun, go, rust, cargo, gcc]
    taints: [phone]
    model: SM-S906U1
    phone_modes:
      light: {cpus: "0-1", slots: 1, memory_pct: 25}
      worker: {cpus: "0-6", slots: 4, memory_pct: 75, min_battery_pct: 0}
    phone_packages: [nodejs, bun, go, rust, gcc]
    android:
      adb_host: 100.72.191.23    # galaxy-s22 Android app node; groot has no adb pairing yet
      revive: false
    health:
      min_mem_available_mb: 1200
      min_disk_free_gb: 5
      max_android_thermal_status: 1
      on_unhealthy: pause
    lane:
      mem_floor_mb: 1200
      default_mem: 512M
      mem_max: 5G
      cpus: 0-6
  groot:
    role: server
    tailnet_ip: 100.113.138.100
    arch: amd64
    classes: [render]
    # groot is the owner's desktop and the control plane: report only, never cordon
    # it (the factory gateway and kueue are pinned here). It runs no host lane.
    taints: ["z0.dev/host=interactive:PreferNoSchedule"]
    health:
      on_unhealthy: report
    kubelet:
      system_reserved: cpu=2,memory=4Gi
      kube_reserved: cpu=1,memory=1Gi
      eviction_hard: memory.available<1Gi,nodefs.available<10%,imagefs.available<10%
      eviction_soft: memory.available<1536Mi
      eviction_soft_grace: memory.available=2m

# Known devices that are not workers (yet). `fleet enroll` refuses anything not
# listed under nodes; move an entry up once the device is verified online.
candidates:
  pc-2080s:   {note: "RTX 2080 Super desktop; not on the tailnet. GPU worker: classes [render, build, cpu-heavy]."}
  oracle-arm: {note: "Oracle Always Free Ampere A1 (arm64, 4 OCPU/24 GB). 24/7 CPU worker; images must be multi-arch."}
  cursor:     {note: "linux, offline since 2026-09-26; identify before enrolling."}
  cos:        {note: "linux, offline since 2026-09-05; identify before enrolling."}
