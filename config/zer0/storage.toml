schema = 1
root_reserve_gib = 20
# Only idle, unopened caches/toolchains and inactive Actual Hermes releases.
# The mover verifies copies and leaves compatibility symlinks.
idle_cache_globs = [
  ".npm/_cacache",
  ".cargo/registry",
  "go/pkg/mod",
  ".gradle/caches",
  ".elan/toolchains",
  ".actual/hermes/[0-9a-f]*",
]
