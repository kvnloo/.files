# Groot: 23.36 GiB RAM, zram-only swap. See docs/fleet/DESKTOP-ADMISSION.md.
# Retain measured cache/reclaim policy from 99-zz-groot-memory; distro already
# supplies page-cluster=0, vfs_cache_pressure=50 and 256/64 MiB dirty byte caps.
vm.swappiness = 180
vm.watermark_scale_factor = 200
# Explicitly restore byte caps after obsolete ratio writers have been removed.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Preserve nonconflicting existing workstation/container limits and network policy.
fs.nr_open = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
vm.max_map_count = 1048576
vm.overcommit_memory = 0
vm.overcommit_ratio = 100
kernel.pid_max = 4194304
kernel.threads-max = 4194304
kernel.sched_autogroup_enabled = 0
net.core.somaxconn = 65535
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 10
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.ip_local_port_range = 10000 65535
net.netfilter.nf_conntrack_max = 1048576
