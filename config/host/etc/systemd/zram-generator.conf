# Groot: staged for the NEXT controlled reboot, never swapoff/restart live.
# Historical failed_writes=8655925 and allocator peak ~12.54 GB reached ram/2.
# Compression varied (~1.45:1 historically); never promise a fixed ratio.
# Bound logical and resident capacity equally: budget ~2.92 GiB physical plus
# allocator overhead. This removes dependence on optimistic compression, not
# global OOM risk. Hard workload caps still overlap beyond physical RAM.
# See operations/groot-oom/SYSTEM-OOMD.md and DESKTOP-ADMISSION.md.
[zram0]
zram-size = ram / 8
zram-resident-limit = ram / 8
compression-algorithm = zstd
swap-priority = 200
options = discard
