# Groot: preserve existing zram capacity; no resize or reboot change.
# Historical failed_writes=8655925 coincided with resident-pool exhaustion.
# Correct overcommitted workload budgets, not swap capacity, first.
# Compression varies; oomd does not guarantee that the worst agent is stopped.
# Reconsider only with measured PSI, failed_writes and OOM counts over >=24h.
[zram0]
zram-size = ram
zram-resident-limit = ram / 2
compression-algorithm = zstd
swap-priority = 200
options = discard
