# Groot debugging evidence: packaged50MiB cap discarded same-day incident logs.
# Root filesystem ~132GiB; 1GiB journal ceiling is <1%, leaving >=2GiB free
# when journald can honor the reserve. Bulk payloads belong on /mnt/zer0models.
# 30day is maximum age, not minimum retention: volume/space can rotate sooner.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=30day
