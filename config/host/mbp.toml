# Same measured T3 agent budget as groot: hard 4G ceiling, no MemoryHigh reclaim stalls. mbp peak was
# 916M resident + 138M swap (2026-10-26), so 4G keeps >3x headroom and is far below T3's own 11.6G default.
[[user]]
live = "~/.config/systemd/user/app-t3code-agents.slice.d/50-host-budget.conf"
source = "config/systemd/user/app-t3code-agents.slice.d/50-host-budget.conf"
scope = "user"
install = "symlink-stamped"
owner = "scripts/apply-agent-oom"
reason = "Measured policy; docs/fleet/DESKTOP-ADMISSION.md user layer."
drift = "owned-upstream"
issue = "https://github.com/pingdotgg/t3code/issues/24708"

# Reviewed 2026-10-26 per file; none needs merging. The live files carry the installer's locale, the operator's
# pacman options and repos, rate-mirrors output and NetworkManager's resolver, so those leftovers are deleted.
# tpm2-tss 4.x renamed the FAPI profile fields and the FAPI keystore is empty, so the new profiles are taken.
[[pending_action]]
paths = ["/etc/locale.gen.pacnew", "/etc/pacman.conf.pacnew", "/etc/pacman.d/mirrorlist.pacnew", "/etc/pacman.d/cachyos-mirrorlist.pacnew", "/etc/pacman.d/cachyos-v3-mirrorlist.pacnew", "/etc/pacman.d/cachyos-v4-mirrorlist.pacnew", "/etc/resolv.conf.pacnew", "/etc/tpm2-tss/fapi-profiles/P_ECCP384SHA384.json.pacnew", "/etc/tpm2-tss/fapi-profiles/P_RSA3072SHA384.json.pacnew"]
owner = "operator package configuration review"
command = "sudo rm /etc/locale.gen.pacnew /etc/pacman.conf.pacnew /etc/pacman.d/mirrorlist.pacnew /etc/pacman.d/cachyos-mirrorlist.pacnew /etc/pacman.d/cachyos-v3-mirrorlist.pacnew /etc/pacman.d/cachyos-v4-mirrorlist.pacnew /etc/resolv.conf.pacnew && sudo mv /etc/tpm2-tss/fapi-profiles/P_ECCP384SHA384.json.pacnew /etc/tpm2-tss/fapi-profiles/P_ECCP384SHA384.json && sudo mv /etc/tpm2-tss/fapi-profiles/P_RSA3072SHA384.json.pacnew /etc/tpm2-tss/fapi-profiles/P_RSA3072SHA384.json"
reason = "Root-only; the per-file review above found nothing to merge."
