# mbp managed path inventory. Starts with the host-drift layer; units are adopted as they are stamped.
# Home-relative and host-generic only: sensitive per-host values live in the private z0-hosts instance.

# T3's packaged runtime writes these runtime property overrides at start (pingdotgg/t3code#24708); they outrank the
# tracked budget drop-in below. Exact mbp bytes, removed only while unchanged (a changed one may be a lease).
user_control_cleanup = [
  { live = "/run/user/1000/systemd/user.control/app-t3code-agents.slice.d/50-MemoryHigh.conf", sha256 = "8cd837bc1d804e88606fe548bc0b34b51f83c70c87aacf04dd821084e778d099" },
  { live = "/run/user/1000/systemd/user.control/app-t3code-agents.slice.d/50-MemoryMax.conf", sha256 = "9141d91c1599e82234121b84e4b30017368bdff97b03343eedf3c6cff4bb7c0a" },
]

