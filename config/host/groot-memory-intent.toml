unit = "agent.slice"
property = "MemorySwapMax"
equals = "6G"
owner = "70-owner-speed-20261106.conf"

[[unit]]
group = "batch"
unit = "agentsview.service"
property = "MemorySwapMax"
equals = "3G"
owner = "62-swap-bound.conf"

# ctx.service: batch indexer with crash-loop history (100+ oom_memcg kills/7d)
# Keep hard MemoryMax=5G, add MemoryHigh=4G (80%) so it reclaims before dying
[[unit]]
group = "batch"
unit = "ctx.service"
property = "MemoryHigh"
equals = "4G"
owner = "50-resource-policy.conf"
why = "reclaim at 80% of hard cap; crash-loop history (100+ oom_memcg kills/7d)"

[[unit]]
group = "batch"
unit = "ctx.service"
property = "MemoryMax"
equals = "5G"
owner = "50-resource-policy.conf"
why = "hard ceiling for ctx import pipeline"

[[unit]]
group = "batch"
unit = "ctx.service"
property = "MemorySwapMax"
equals = "2G"
owner = "50-resource-policy.conf"
why = "swap buffer for cold pages"

[[cgroup]]
