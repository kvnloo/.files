# groot memory policy: the EFFECTIVE values scripts/memory-drift requires (L10).
# One row per declared key. `owner` = the drop-in file name that must win for that key;
# a later-sorting file or a set-property residue that wins instead is drift.
# Groups follow the apply order of INFRA-1/2/4 (2026-10-27): base (already live before
# that night), ui, batch, app. Root-owned items (journald, kubelet, UI oom_score_adj)
# are follow-ups and are not declared here until they are applied.

# ---- base: protection chain that exists today ------------------------------------
[[cgroup]]
group = "base"
path = "user.slice"
file = "memory.min"
equals = "7G"
why = "ancestor chain must carry the UI min (70-desktop-reserve.conf, root)"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice"
file = "memory.min"
equals = "7G"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service"
file = "memory.min"
equals = "7G"

[[unit]]
group = "base"
unit = "session.slice"
property = "MemoryMin"
equals = "7G"
owner = "50-desktop-protection.conf"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/session.slice"
file = "memory.min"
equals = "7G"

[[placement]]
group = "base"
comm = "Hyprland"
under = "session.slice"
why = "UI protection is useless if the compositor is not in the protected subtree"

[[placement]]
group = "base"
comm = "Xwayland"
under = "session.slice"
optional = true

[[unit]]
group = "base"
unit = "agent.slice"
property = "MemoryMax"
equals = "16G"
owner = "70-owner-speed-20261106.conf"
why = "throttle at 13G, hard cap 16G per owner decision 2026-11-06"

[[unit]]
group = "base"
unit = "agent.slice"
property = "MemoryHigh"
equals = "13G"
owner = "70-owner-speed-20261106.conf"
why = "reclaim instead of killing; 13G throttle, 16G hard cap"

[[unit]]
group = "base"
unit = "agent.slice"
property = "MemorySwapMax"
equals = "6G"
owner = "70-owner-speed-20261106.conf"
why = "agents may park cold pages in zram up to 6G"

[[unit]]
group = "base"
unit = "agent.slice"
property = "CPUWeight"
equals = "100"
owner = "70-owner-speed-20261106.conf"
why = "default CPU share, no starvation vs idle services"

[[unit]]
group = "base"
unit = "agent.slice"
property = "IOWeight"
equals = "100"
owner = "70-owner-speed-20261106.conf"
why = "default IO share"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/agent.slice"
file = "memory.max"
equals = "16G"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/agent.slice"
file = "memory.high"
equals = "13G"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/agent.slice"
file = "memory.swap.max"
equals = "6G"

[[unit]]
group = "base"
unit = "ctx-import.service"
property = "MemoryMax"
equals = "4G"
why = "ctx stays manual; the hourly import is the only automatic ctx job and it is bounded"

[[unit]]
group = "base"
unit = "model-servers.slice"
property = "MemoryHigh"
equals = "5G"
owner = "model-servers.slice"
why = "throttle and reclaim first for local model servers"

[[unit]]
group = "base"
unit = "model-servers.slice"
property = "MemoryMax"
equals = "6G"
owner = "model-servers.slice"
why = "hard cap for all llama.cpp lanes together"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/model.slice/model-servers.slice"
file = "memory.high"
equals = "5G"
why = "live slice path: model.slice/model-servers.slice (the plain user@1000.service path does not exist)"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/model.slice/model-servers.slice"
file = "memory.max"
equals = "6G"

[[sysctl]]
group = "base"
key = "vm.swappiness"
equals = "180"
why = "declared, not inherited: the CachyOS udev rule resets it at zram init"

