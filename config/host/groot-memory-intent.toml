# groot memory policy: the EFFECTIVE values scripts/memory-drift requires (L10).
# One row per declared key. `owner` = the drop-in file name that must win for that key;
# a later-sorting file or a set-property residue that wins instead is drift.
# Groups follow the apply order of INFRA-1/2/4 (2026-10-27): base (already live before
# that night), ui, batch, app. Root-owned items (journald, kubelet, UI oom_score_adj)
# are follow-ups and are not declared here until they are applied.

# ---- base: protection chain that exists today ------------------------------------
[[cgroup]]
group = "base"
path = "user.slice"
file = "memory.min"
equals = "7G"
why = "ancestor chain must carry the UI min (70-desktop-reserve.conf, root)"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice"
file = "memory.min"
equals = "7G"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service"
file = "memory.min"
equals = "7G"

[[unit]]
group = "base"
unit = "session.slice"
property = "MemoryMin"
equals = "7G"
owner = "50-desktop-protection.conf"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/session.slice"
file = "memory.min"
equals = "7G"

[[placement]]
group = "base"
comm = "Hyprland"
under = "session.slice"
why = "UI protection is useless if the compositor is not in the protected subtree"

[[placement]]
group = "base"
comm = "Xwayland"
under = "session.slice"
optional = true

[[unit]]
group = "base"
unit = "agent.slice"
property = "MemoryMax"
equals = "16G"
owner = "60-oomd-desktop-guard.conf"
why = "one owner for the agent ceiling; owner 2026-11-06 raised 10G->16G (10G OOM-killed 13 workers); a 50-MemoryMax.conf residue (14G) shadowed by 60- was attempt #33"

[[cgroup]]
group = "base"
path = "user.slice/user-1000.slice/user@1000.service/agent.slice"
file = "memory.max"
equals = "16G"

[[unit]]
group = "base"
unit = "agent.slice"
property = "MemoryHigh"
equals = "13G"
owner = "60-oomd-desktop-guard.conf"
why = "owner 2026-11-06: throttle at 13G instead of killing at 10G; 3G headroom below MemoryMax avoids the recorded MemoryHigh-near-swap-cap livelock"

[[unit]]
group = "base"
unit = "ctx-import.service"
property = "MemoryMax"
equals = "4G"
why = "ctx stays manual; the hourly import is the only automatic ctx job and it is bounded"

[[sysctl]]
group = "base"
key = "vm.swappiness"
equals = "180"
why = "declared, not inherited: the CachyOS udev rule resets it at zram init"

# ---- ui: no swap for the desktop subtree, shell and fixed-size UI leaves ----------
[[unit]]
group = "ui"
unit = "session.slice"
property = "MemorySwapMax"
equals = "0"
owner = "60-desktop-no-swap.conf"
why = "desktop latency must not depend on zram swap-ins; children inherit this ceiling"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice"
file = "memory.swap.max"
equals = "0"

[[unit]]
group = "ui"
unit = "noctalia-shell.service"
property = "MemorySwapMax"
equals = "0"
owner = "60-desktop-no-swap.conf"
why = "explicit shell guarantee even if launch placement changes"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/noctalia-shell.service"
file = "memory.swap.max"
equals = "0"

[[unit]]
group = "ui"
unit = "wayland-wm@hyprland.desktop.service"
property = "MemorySwapMax"
equals = "0"
owner = "60-ui-tier.conf"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/wayland-wm@hyprland.desktop.service"
file = "memory.swap.max"
equals = "0"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/pipewire.service"
file = "memory.swap.max"
equals = "0"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/pipewire.service"
file = "memory.max"
equals = "256M"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/wireplumber.service"
file = "memory.swap.max"
equals = "0"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/pipewire-pulse.service"
file = "memory.swap.max"
equals = "0"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/xdg-desktop-portal.service"
file = "memory.swap.max"
equals = "0"

[[cgroup]]
group = "ui"
path = "user.slice/user-1000.slice/user@1000.service/session.slice/xdg-desktop-portal-hyprland.service"
file = "memory.swap.max"
equals = "0"

# ---- batch: agents absorb pressure in swap; indexers bounded ---------------------
[[unit]]
group = "batch"
unit = "agent.slice"
property = "MemorySwapMax"
equals = "6G"
owner = "60-oomd-desktop-guard.conf"

[[cgroup]]
group = "batch"
path = "user.slice/user-1000.slice/user@1000.service/agent.slice"
file = "memory.swap.max"
equals = "6G"

[[unit]]
group = "batch"
unit = "agentsview.service"
property = "MemorySwapMax"
equals = "3G"
owner = "62-swap-bound.conf"

# ---- app: DEFERRED 2026-10-27 -------------------------------------------------
# A hard app.slice ceiling was withdrawn before apply: in the 2 h before, app.slice used
# up to 5.9G RAM and 9.3G swap (lifetime peak 15.0G RAM), and it holds the live Dash
# bridge/metro, Hermes services and z0bridge-identity. An 8G MemoryMax/MemorySwapMax would
# OOM-kill or squeeze live sessions; slice-wide MemoryHigh is the recorded livelock.
# Next: move the live session services to their own protected slice first, then cap the rest.
