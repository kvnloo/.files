# CamillaDSP Main Configuration — Headphone DSP (Clean)
#
# macOS equivalent of PipeWire filter-chain DSP setup.
# Signal chain: AutoEQ FIR Convolver → Compressor → Limiter
#
# Profiles (swap via websocket SetConfig or headphone-switch.sh):
#   camilladsp.yml            — Clean (EQ + limiter only)
#   camilladsp-crossfeed.yml  — EQ + bs2b-style crossfeed + limiter
#   camilladsp-room.yml       — EQ + BRIR true stereo room + limiter
#
# Usage:
#   camilladsp -p 1234 ~/.config/camilladsp/camilladsp.yml
#
# Requires: BlackHole 2ch set as macOS system output

devices:
  samplerate: 44100
  chunksize: 4096
  enable_rate_adjust: true
  capture:
    type: CoreAudio
    channels: 2
    device: "BlackHole 2ch"
    format: F32
  playback:
    type: CoreAudio
    channels: 2
    device: "Moonriver 2"
    exclusive: true
    format: S32

filters:
  # ── AutoEQ FIR Convolver (headphone frequency correction) ──
  eq_l:
    type: Conv
    parameters:
      type: Wav
      filename: "coeffs/active_44100Hz.wav"
      channel: 0

  eq_r:
    type: Conv
    parameters:
      type: Wav
      filename: "coeffs/active_44100Hz.wav"
      channel: 1

  # ── Safety Limiter (replaces ZaMaximX2 @ -0.3 dBFS) ──
  limiter:
    type: Limiter
    parameters:
      soft_clip: true
      clip_limit: -0.3

# ── Gentle Compressor (fatigue reduction — tame peaks, lift quiet detail) ──
processors:
  compressor:
    type: Compressor
    parameters:
      channels: 2
      attack: 0.05
      release: 0.8
      threshold: -20
      factor: 3.0
      makeup_gain: 0
      soft_clip: true

pipeline:
  - type: Filter
    channels: [0]
    names:
      - eq_l
  - type: Filter
    channels: [1]
    names:
      - eq_r
  - type: Processor
    name: compressor
  - type: Filter
    channels: [0]
    names:
      - limiter
  - type: Filter
    channels: [1]
    names:
      - limiter
