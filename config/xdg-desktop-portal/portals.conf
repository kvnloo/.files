# Tell xdg-desktop-portal to use the Hyprland backend for screen sharing
# Without this, the portal may fall back to a GTK/wlr backend that doesn't
# properly support window/screen enumeration on Hyprland.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
