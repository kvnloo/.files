# hyprglass 0.10 settings (windows, presets, exclusions) and glass group bar colours.
# Sourced at the end of hyprland.legacy.conf. The plugin is loaded by the plugin = line at its top.
plugin:hyprglass {
    enabled = 1
    default_theme = dark
    default_preset = Prism
    manage_window_blur = 1
    skip_opaque_windows = 1
    blur_fold = 1
    glass_opacity = 1.0
    saturation = 1.0
    adaptive_boost = 0.0
    edge_thickness = 0.10
    refraction_flow = 0.0
    refraction_spread = 0.65
    fresnel_tint = 0.0
    fresnel_color = 0xffffff00
    bevel_size = 1.0
    bevel_angle = 315.0
    bevel_color = 0xffffff00
    bevel_tint = 0.0
    bevel_shadow = 0.08
    specular_angle = 315.0
    self_sample = 0.0
    xray = 0
    windows {
        background_cache = 1
        live_resample = 1
        live_resample_fps = 30
    }
    subsurfaces {
        enabled = 0
    }
    preset = name:Clear, blur_strength:0.25, blur_iterations:1, refraction_strength:0.20, chromatic_aberration:0, fresnel_strength:0.25, specular_strength:0.30, noise_strength:0, adaptive_dim:0.25, contrast:1, brightness:0.92, vibrancy:0.10, vibrancy_darkness:0, bevel_strength:0.30, lens_distortion:0.12, xray:0, self_sample:0
    preset = name:Clear:dark, tint_color:0x08130633
    preset = name:Clear:light, tint_color:0xedf4eb4d
    preset = name:Frost, blur_strength:1.60, blur_iterations:3, refraction_strength:0.15, chromatic_aberration:0, fresnel_strength:0.30, specular_strength:0.35, noise_strength:0.12, adaptive_dim:0.35, contrast:0.95, brightness:0.82, vibrancy:0.20, vibrancy_darkness:0.10, bevel_strength:0.22, lens_distortion:0.18, xray:0, self_sample:0
    preset = name:Frost:dark, tint_color:0x08130675
    preset = name:Frost:light, tint_color:0xedf4eb94
    preset = name:Smoke, blur_strength:2.0, blur_iterations:3, refraction_strength:0.08, chromatic_aberration:0, fresnel_strength:0.20, specular_strength:0.20, noise_strength:0.12, adaptive_dim:0.55, contrast:0.90, brightness:0.62, vibrancy:0.12, vibrancy_darkness:0, bevel_strength:0.14, lens_distortion:0.08, xray:0, self_sample:0
    preset = name:Smoke:dark, tint_color:0x081306bd
    preset = name:Smoke:light, tint_color:0xedf4ebd1
    preset = name:Prism, blur_strength:0.70, blur_iterations:2, refraction_strength:0.90, chromatic_aberration:0.30, fresnel_strength:0.40, specular_strength:0.45, noise_strength:0.01, adaptive_dim:0.30, contrast:1, brightness:0.86, vibrancy:0.24, vibrancy_darkness:0.10, bevel_strength:0.36, lens_distortion:0.60, xray:0, self_sample:0
    preset = name:Prism:dark, tint_color:0x0813064d
    preset = name:Prism:light, tint_color:0xedf4eb6b
    # One glass tint per monitor, taken from that monitor's wallpaper. The window rules at the end
    # of this file tag each window with the preset of the monitor its workspace is on.
    preset = name:MonDP1, inherits:Prism
    preset = name:MonDP1:dark, tint_color:0x0813064d
    preset = name:MonDP2, inherits:Prism
    preset = name:MonDP2:dark, tint_color:0x0a14224d
    preset = name:Slate, blur_strength:0, blur_iterations:1, refraction_strength:0, chromatic_aberration:0, fresnel_strength:0, specular_strength:0, noise_strength:0, adaptive_dim:0, contrast:1, brightness:1, vibrancy:0, vibrancy_darkness:0, bevel_strength:0, bevel_shadow:0, lens_distortion:0, xray:0, self_sample:0
    preset = name:Slate:dark, tint_color:0x081306f7
    preset = name:Slate:light, tint_color:0xedf4ebfa
    layers {
        enabled = 0
        namespaces = noctalia-background-DP-1
        preset = Frost
        namespace_presets = noctalia-background-DP-1:Frost, noctalia-background-DP-2:Frost, noctalia-dock-DP-1:Clear, noctalia-dock-DP-2:Clear
        mask_threshold = 0.18
        mask_mode = alpha
        mask_feather = 0.0
        manage_blur = 1
        live_resample = 1
        live_resample_fps = 30
        force_live_resample = 0
    }
}

# The plugin has no fullscreen, class, game, or title exclusion keys.
# Existing fullscreen and steam/Plex/wallpaper-engine tag rules stay in the live file.
windowrule = tag +hyprglass_disabled, match:class ^(mpv|vlc|Vlc|org.videolan.VLC|plex|Plex HTPC|Celluloid|celluloid|io.github.celluloid_player.Celluloid|org.gnome.Totem|totem|gamescope|steam_app_.*|lutris|Lutris|heroic|Heroic|com.heroicgameslauncher.hgl|linux-wallpaper|linux-wallpaperengine)$
windowrule = tag +hyprglass_disabled, match:title ^(Picture-in-Picture|Picture in picture|Picture in Picture)$

# Glass group bar: overrides the solid theme colours sourced earlier.
group:groupbar:col.active = rgba(08130699)
group:groupbar:col.inactive = rgba(08130640)
group:groupbar:col.locked_active = rgba(08130699)
group:groupbar:col.locked_inactive = rgba(08130640)
group:groupbar:text_color = rgba(e6d06aff)
group:groupbar:text_color_inactive = rgba(a9c0c4cc)
group:groupbar:text_color_locked_active = rgba(e6d06aff)
group:groupbar:text_color_locked_inactive = rgba(a9c0c4cc)
# Glass group bar: overrides the solid theme colours sourced earlier.

# Per-monitor glass: a window takes the tint of the monitor it is on, and changes when it moves.
# This also holds in the middle of a mouse drag: the window changes workspace when its centre
# crosses onto the other monitor, and the rules are checked again at that moment.
# The "-" rules are required. Hyprland 0.56.2 does not remove a tag that a rule added with "+"
# when the rule stops matching, so without them a moved window keeps both tags and hyprglass
# always picks MonDP1.
windowrule = tag +hyprglass_preset_MonDP1, match:workspace m[DP-1]
windowrule = tag -hyprglass_preset_MonDP2, match:workspace m[DP-1]
windowrule = tag +hyprglass_preset_MonDP2, match:workspace m[DP-2]
windowrule = tag -hyprglass_preset_MonDP1, match:workspace m[DP-2]
