# =====================================================
# HYPRLOCK CONFIGURATION
# =====================================================
# Lock screen for Hyprland
# See: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# =====================================================

# =====================================================
# BACKGROUND
# =====================================================

background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# =====================================================
# INPUT FIELD
# =====================================================

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(75A4CD)
    inner_color = rgb(2f343f)
    font_color = rgb(f3f4f5)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = rgb(61C766)
    fail_color = rgb(EC7875)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgb(EDB83F)
    position = 0, -20
    halign = center
    valign = center
}

# =====================================================
# CLOCK LABEL
# =====================================================

label {
    monitor =
    text = $TIME
    color = rgb(f3f4f5)
    font_size = 72
    font_family = Roboto Mono Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(000000)
}

# =====================================================
# GREETING LABEL
# =====================================================

label {
    monitor =
    text = Hi, $USER
    color = rgb(C4C7C5)
    font_size = 18
    font_family = Roboto Mono
    position = 0, 70
    halign = center
    valign = center
}

# =====================================================
# DATE LABEL
# =====================================================

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(C4C7C5)
    font_size = 14
    font_family = Roboto Mono
    position = 0, -80
    halign = center
    valign = center
}
