# Colours. These defaults are the hand-picked look; `theme wire hyprlock` adds a
# source line below the marker so the unified theme manager can override them.
$lock_outer = rgb(75A4CD)
$lock_inner = rgb(2f343f)
$lock_font = rgb(f3f4f5)
$lock_check = rgb(61C766)
$lock_fail = rgb(EC7875)
$lock_capslock = rgb(EDB83F)
$lock_text = rgb(f3f4f5)
$lock_subtext = rgb(C4C7C5)
$lock_shadow = rgb(000000)
# theme:source (generated overrides are sourced on the next line once wired)

# =====================================================
# HYPRLOCK CONFIGURATION
# =====================================================
# Lock screen for Hyprland
# See: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
# =====================================================

# =====================================================
# BACKGROUND
# =====================================================

background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# =====================================================
# INPUT FIELD
# =====================================================

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $lock_outer
    inner_color = $lock_inner
    font_color = $lock_font
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = $lock_check
    fail_color = $lock_fail
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = $lock_capslock
    position = 0, -20
    halign = center
    valign = center
}

# =====================================================
# CLOCK LABEL
# =====================================================

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_size = 72
    font_family = Roboto Mono Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $lock_shadow
}

# =====================================================
# GREETING LABEL
# =====================================================

label {
    monitor =
    text = Hi, $USER
    color = $lock_subtext
    font_size = 18
    font_family = Roboto Mono
    position = 0, 70
    halign = center
    valign = center
}

# =====================================================
# DATE LABEL
# =====================================================

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $lock_subtext
    font_size = 14
    font_family = Roboto Mono
    position = 0, -80
    halign = center
    valign = center
}
