# =====================================================
# HYPRLAND CONFIGURATION
# =====================================================
# Translated from i3/picom/polybar dotfiles
# See: https://wiki.hyprland.org/Configuring/
# =====================================================

# =====================================================
# SECTION 1: MONITORS
# =====================================================
# Verify connector names with: hyprctl monitors
# X11 -> Wayland mapping: HDMI-0 -> HDMI-A-1, DP-2 -> DP-2, DP-0 -> DP-1
# Layout: [Left 1080p] [Center portrait 1080x1920] [Right 1080p PRIMARY]

monitor = HDMI-A-1, 1920x1080@75, 0x420, 1              # Left - Dell S3222HN (was HDMI-0)
monitor = DP-2, 1920x1080@240, 1920x0, 1, transform, 1  # Center portrait - AOP 25XV2Q F (was DP-2, rotated left)
monitor = DP-1, 1920x1080@540, 3000x420, 1              # Right primary - ASUS ROG PG248QP (was DP-0)

# Fallback for any unmatched monitor
monitor = , preferred, auto, 1

# =====================================================
# SECTION 2: WORKSPACE ASSIGNMENTS
# =====================================================
# Workspace -> Monitor binding (from i3 config)

# Workspace-monitor assignments removed — workspaces show on whichever monitor they're opened on
# To re-pin, uncomment:
# workspace = 1, monitor:DP-2         # Code -> center portrait
# workspace = 2, monitor:DP-1         # Browse -> right primary
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:DP-2
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:DP-1
# workspace = 7, monitor:DP-1
# workspace = 8, monitor:DP-1
# workspace = 9, monitor:DP-1
# workspace = 10, monitor:HDMI-A-1    # Music -> left

# =====================================================
# SECTION 2.1: ENVIRONMENT VARIABLES
# =====================================================

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24

# =====================================================
# SECTION 3: INPUT
# =====================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

# =====================================================
# SECTION 4: GENERAL
# =====================================================

general {
    gaps_in = 12
    gaps_out = 0
    border_size = 4

    # Pywal-compatible colors (fallback defaults)
    col.active_border = rgba(75A4CDff) rgba(BE78D1ff) 45deg
    col.inactive_border = rgba(2f343faa)

    layout = hy3
    allow_tearing = false
}

# =====================================================
# SECTION 5: DECORATION (from picom)
# =====================================================

decoration {
    rounding = 12              # picom corner-radius = 12

    # Opacity (from picom inactive-opacity/active-opacity)
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 12             # picom shadow-radius = 12
        offset = -12 -12       # picom shadow-offset-x/y = -12
        render_power = 3
        color = rgba(00000080) # picom shadow-opacity = 0.5
    }

    blur {
        enabled = true
        size = 5
        passes = 2             # dual_kawase approximation
        new_optimizations = true
        noise = 0.02
        vibrancy = 0.17
    }
}

# =====================================================
# SECTION 6: ANIMATIONS (from picom)
# =====================================================

animations {
    enabled = true

    # Translated from picom animation settings
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.4, 0.8, 0.2, 1.2

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smoothIn, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 40, default, loop
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slidevert
}

# =====================================================
# SECTION 7: LAYOUTS
# =====================================================

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2            # Always split to the right/bottom
}

master {
    new_status = master
}

# =====================================================
# SECTION 7.1: HY3 PLUGIN (i3-style tiling)
# =====================================================

plugin {
    hy3 {
        no_gaps_when_only = 0
        node_collapse_policy = 2
        group_inset = 10
        tab_first_window = false

        tabs {
            height = 22
            padding = 6
            from_top = false
            radius = 6
            border_width = 2
            render_text = true
            text_center = true
            text_font = Sans
            text_height = 8
            text_padding = 3

            # Colors — matched to pywal-compatible border colors
            col.active = rgba(75A4CD40)
            col.active.border = rgba(75A4CDee)
            col.active.text = rgba(ffffffff)

            col.focused = rgba(60606040)
            col.focused.border = rgba(808080ee)
            col.focused.text = rgba(ffffffff)

            col.inactive = rgba(30303020)
            col.inactive.border = rgba(2f343faa)
            col.inactive.text = rgba(ffffffaa)

            col.urgent = rgba(ff223340)
            col.urgent.border = rgba(ff2233ee)
            col.urgent.text = rgba(ffffffff)

            blur = true
            opacity = 1.0
        }

        autotile {
            enable = false
        }
    }
}

# =====================================================
# SECTION 8: GESTURES
# =====================================================

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_create_new = true
}

# =====================================================
# SECTION 9: MISC
# =====================================================

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# =====================================================
# SECTION 10: WINDOW RULES
# =====================================================

# Application -> workspace assignments (from i3 assign)
windowrule = match:class ^(Spotify|spotify)$, workspace 10
windowrule = match:class ^(high-tide)$, workspace 10
windowrule = match:class ^(kitty)$, workspace 1
windowrule = match:class ^(google-chrome|google-chrome-unstable|Google-chrome)$, workspace 2

# Scratchpad terminal
windowrule = match:class ^(scratch_term)$, float on
windowrule = match:class ^(scratch_term)$, size 80% 70%
windowrule = match:class ^(scratch_term)$, center on
windowrule = match:class ^(scratch_term)$, workspace special:scratch_term

# Floating windows
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
# Chrome PIP (right-click video → Picture in Picture)
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, decorate off
windowrule = match:title ^(Picture-in-Picture)$, pin on

# Google Meet PIP (title is "Meet - xxx-xxxx-xxx" without " - Google Chrome" suffix)
windowrule = match:class ^(google-chrome)$, match:title ^(Meet - [a-z]+-[a-z]+-[a-z]+)$, float on
windowrule = match:class ^(google-chrome)$, match:title ^(Meet - [a-z]+-[a-z]+-[a-z]+)$, decorate off
windowrule = match:class ^(google-chrome)$, match:title ^(Meet - [a-z]+-[a-z]+-[a-z]+)$, pin on

windowrule = match:title ^(Volume Control)$, float on

# Opacity & blur overrides
windowrule = match:class ^(Alacritty)$, opacity 0.95 0.90
windowrule = match:class ^(dev.warp.Warp)$, opacity 0.95 0.90
windowrule = match:class ^(Code)$, opacity 0.95 0.90
windowrule = match:class ^(org.telegram.desktop)$, opacity 0.88 0.82

# Inhibit idle when fullscreen
windowrule = idle_inhibit fullscreen

# =====================================================
# SECTION 11: KEY BINDINGS
# =====================================================

$mod = SUPER

# Core application shortcuts
bind = $mod, Return, exec, kitty
bind = $mod SHIFT, E, exec, nautilus
bind = $mod SHIFT, Q, killactive

# Night mode wake (locked bind — works even with DPMS off)
bindl = $mod, N, exec, $HOME/workspace/.files/scripts/night-mode.sh off

# Rofi launchers
bind = $mod, space, exec, rofi -show drun
bind = $mod SHIFT, space, exec, rofi -show run
bind = $mod, Tab, exec, rofi -show window

# Fullscreen and floating
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, togglefloating

# -----------------------------------------------------
# DWINDLE BINDINGS (uncomment these + set layout=dwindle to revert)
# -----------------------------------------------------
# bind = $mod, H, movefocus, l
# bind = $mod, J, movefocus, d
# bind = $mod, K, movefocus, u
# bind = $mod, L, movefocus, r
# bind = $mod, left, movefocus, l
# bind = $mod, down, movefocus, d
# bind = $mod, up, movefocus, u
# bind = $mod, right, movefocus, r
# bind = $mod SHIFT, H, movewindoworgroup, l
# bind = $mod SHIFT, J, movewindoworgroup, d
# bind = $mod SHIFT, K, movewindoworgroup, u
# bind = $mod SHIFT, L, movewindoworgroup, r
# bind = $mod SHIFT, left, movewindoworgroup, l
# bind = $mod SHIFT, down, movewindoworgroup, d
# bind = $mod SHIFT, up, movewindoworgroup, u
# bind = $mod SHIFT, right, movewindoworgroup, r
# bind = $mod, C, layoutmsg, preselect l
# bind = $mod, V, layoutmsg, preselect d
# bind = $mod, W, togglegroup
# bind = $mod, E, togglesplit
# bind = $mod, bracketright, changegroupactive, f
# bind = $mod, bracketleft, changegroupactive, b
# bind = $mod SHIFT, G, moveoutofgroup
# bind = $mod, A, focuscurrentorlast

# -----------------------------------------------------
# HY3 BINDINGS (i3-style tiling)
# -----------------------------------------------------
# Focus navigation (vim-style)
bind = $mod, H, hy3:movefocus, l
bind = $mod, J, hy3:movefocus, d
bind = $mod, K, hy3:movefocus, u
bind = $mod, L, hy3:movefocus, r

# Focus navigation (arrow keys)
bind = $mod, left, hy3:movefocus, l
bind = $mod, down, hy3:movefocus, d
bind = $mod, up, hy3:movefocus, u
bind = $mod, right, hy3:movefocus, r

# Move windows (vim-style)
bind = $mod SHIFT, H, hy3:movewindow, l
bind = $mod SHIFT, J, hy3:movewindow, d
bind = $mod SHIFT, K, hy3:movewindow, u
bind = $mod SHIFT, L, hy3:movewindow, r

# Move windows (arrow keys)
bind = $mod SHIFT, left, hy3:movewindow, l
bind = $mod SHIFT, down, hy3:movewindow, d
bind = $mod SHIFT, up, hy3:movewindow, u
bind = $mod SHIFT, right, hy3:movewindow, r

# Layout toggles — i3-style
bind = $mod, W, hy3:changegroup, toggletab          # Tabbed (i3 mod+w)
bind = $mod, E, hy3:changegroup, opposite            # Toggle h/v split (i3 mod+e)
bind = $mod, bracketright, hy3:focustab, r, wrap     # Cycle forward in group
bind = $mod, bracketleft, hy3:focustab, l, wrap      # Cycle backward in group

# Shrink/expand node
bind = $mod, S, hy3:expand, shrink                    # Shrink node (like dwindle pseudo)

# Container focus
bind = $mod, A, hy3:changefocus, raise               # Focus parent container

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move container to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move workspace to monitor
bind = $mod SHIFT CTRL, H, movecurrentworkspacetomonitor, l
bind = $mod SHIFT CTRL, L, movecurrentworkspacetomonitor, r
bind = $mod SHIFT CTRL, K, movecurrentworkspacetomonitor, u
bind = $mod SHIFT CTRL, J, movecurrentworkspacetomonitor, d

# Scratchpad
bind = $mod SHIFT, minus, movetoworkspacesilent, special
bind = $mod, minus, togglespecialworkspace
bind = $mod, grave, togglespecialworkspace, scratch_term

# Reload config
bind = $mod SHIFT, R, exec, hyprctl reload && killall waybar; waybar &

# Theme switcher (pywal)
bind = $mod SHIFT, T, exec, $HOME/workspace/.files/scripts/theme-switcher.sh menu
bind = $mod SHIFT, W, exec, $HOME/workspace/.files/scripts/theme-switcher.sh cycle

# =====================================================
# SECTION 11.1: SCREENSHOT BINDINGS
# =====================================================

# Select area -> save to file
bind = $mod, P, exec, grim -g "$(slurp)" ~/Pictures/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

# Select area -> copy to clipboard
bind = $mod SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy

# Full screen -> save to file
bind = $mod CTRL, P, exec, grim ~/Pictures/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png

# Full screen -> copy to clipboard
bind = $mod CTRL SHIFT, P, exec, grim - | wl-copy

# =====================================================
# SECTION 11.2: MEDIA KEYS
# =====================================================

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Restart PipeWire + WirePlumber (WirePlumber auto-restarts via BindsTo=)
bind = $mod SHIFT, A, exec, systemctl --user restart pipewire && notify-send "PipeWire" "Audio stack restarted"

# =====================================================
# SECTION 11.3: RESIZE SUBMAP
# =====================================================

bind = $mod, R, submap, resize

submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , Return, submap, reset
bind = , escape, submap, reset
submap = reset

# =====================================================
# SECTION 11.4: SYSTEM SUBMAP
# =====================================================

bind = $mod SHIFT, X, submap, system · l lock │ n night │ s suspend │ S shutdown │ r reboot │ e exit

submap = system · l lock │ n night │ s suspend │ S shutdown │ r reboot │ e exit
bind = , L, exec, hyprlock
bind = , L, submap, reset
bind = , N, exec, $HOME/workspace/.files/scripts/night-mode.sh on
bind = , N, submap, reset
bind = , E, exit
bind = , S, exec, systemctl suspend
bind = , S, submap, reset
bind = , R, exec, systemctl reboot
bind = SHIFT, S, exec, systemctl poweroff
bind = , Return, submap, reset
bind = , escape, submap, reset
submap = reset

# =====================================================
# SECTION 11.5: MOUSE BINDINGS
# =====================================================

bindm = $mod, mouse:272, movewindow     # Super + LMB to move
bindm = $mod, mouse:273, resizewindow   # Super + RMB to resize

# =====================================================
# SECTION 12: AUTOSTART
# =====================================================

exec-once = hyprpm reload -n
exec-once = waybar
exec-once = dunst
# exec-once = swww-daemon && sleep 0.5 && wal -R
# Wallpaper Engine — per-monitor with matched FPS
$wpe = linux-wallpaperengine --silent --assets-dir /workspace/SteamLibrary/steamapps/common/wallpaper_engine/assets
$wp_dir = /workspace/SteamLibrary/steamapps/workshop/content/431960
exec-once = $wpe --fps 120 --screen-root DP-1 --bg $wp_dir/2133182232 &   # Forgotten Ruins @ 120fps
exec-once = $wpe --fps 120 --screen-root DP-2 --bg $wp_dir/1888636115 &   # Abstract Landscape @ 120fps
exec-once = $wpe --fps 75 --screen-root HDMI-A-1 --bg $wp_dir/2083162856 & # Hollow Knight @ 75fps
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = warp-terminal --class scratch_term
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
