# =====================================================
# HYPRLAND CONFIGURATION
# =====================================================
# Translated from i3/picom/polybar dotfiles
# See: https://wiki.hyprland.org/Configuring/
# =====================================================
# Built against this Hyprland release; loading before sourced colors lets the
# pywal generator update the glass tint without transient config errors.
plugin = /home/kvn/.local/share/hyprland/plugins/hyprglass/hyprglass.so

# =====================================================
# SECTION 1: MONITORS
# =====================================================
# Verify connector names with: hyprctl monitors
# X11 -> Wayland mapping: HDMI-0 -> HDMI-A-1, DP-2 -> DP-2, DP-0 -> DP-1
# Layout: [Left 1080p] [Center portrait 1080x1920] [Right 1080p PRIMARY]

monitor = HDMI-A-1, 1920x1080@75, 0x420, 1              # Left - Dell S3222HN (was HDMI-0)
monitor = DP-2, 1920x1080@240, 1920x0, 1, transform, 1  # Center portrait - AOP 25XV2Q F (was DP-2, rotated left)
monitor = DP-1, 1920x1080@540, 3000x420, 1              # Right primary - ASUS ROG PG248QP (was DP-0)

# Fallback for any unmatched monitor
monitor = , preferred, auto, 1

# =====================================================
# SECTION 2: WORKSPACE ASSIGNMENTS
# =====================================================
# Workspace -> Monitor binding (from i3 config)

# Workspace-monitor assignments removed — workspaces show on whichever monitor they're opened on
# To re-pin, uncomment:
# workspace = 1, monitor:DP-2         # Code -> center portrait
# workspace = 2, monitor:DP-1         # Browse -> right primary
# workspace = 3, monitor:DP-1
# workspace = 4, monitor:DP-2
# workspace = 5, monitor:DP-2
# workspace = 6, monitor:DP-1
# workspace = 7, monitor:DP-1
# workspace = 8, monitor:DP-1
# workspace = 9, monitor:DP-1
# workspace = 10, monitor:HDMI-A-1    # Music -> left

workspace = 1, monitor:DP-1, default:true    # -> right 540Hz (ASUS ROG)
workspace = 10, monitor:HDMI-A-1, default:true # -> left 75Hz (Dell)

# =====================================================
# SECTION 2.1: ENVIRONMENT VARIABLES
# =====================================================

env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24

# =====================================================
# SECTION 3: INPUT
# =====================================================

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

# =====================================================
# SECTION 4: GENERAL
# =====================================================

general {
    gaps_in = 18
    gaps_out = 8
    border_size = 4

    # Pywal-compatible colors (fallback defaults)
    col.active_border = rgba(75A4CDff) rgba(BE78D1ff) 45deg
    col.inactive_border = rgba(2f343faa)

    layout = dwindle
    allow_tearing = false
}

# Native groups: airy tabs with palette colors supplied by pywal below.
group {
    groupbar {
        height = 18
        indicator_height = 2
        gaps_in = 6
        gaps_out = 8
        gradient_rounding = 6
        gradient_round_only_edges = false
    }
}

# Generated active/inactive borders and group tabs. The active gradient rotates
# through the current wallpaper palette via the borderangle animation.
source = ~/.cache/wal/colors-hyprland.conf

# =====================================================
# SECTION 5: DECORATION (from picom)
# =====================================================

decoration {
    rounding = 12              # picom corner-radius = 12

    # Opacity (from picom inactive-opacity/active-opacity)
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 12             # picom shadow-radius = 12
        offset = -12 -12       # picom shadow-offset-x/y = -12
        render_power = 3
        color = rgba(00000080) # picom shadow-opacity = 0.5
    }

    blur {
        enabled = true
        size = 5
        passes = 2             # dual_kawase approximation
        new_optimizations = true
        noise = 0.02
        vibrancy = 0.17
    }
}

# =====================================================
# SECTION 6: ANIMATIONS (from picom)
# =====================================================

animations {
    enabled = true

    # Translated from picom animation settings
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.4, 0.8, 0.2, 1.2

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, smoothIn, slide
    animation = border, 1, 10, default
    animation = borderangle, 1, 40, default, loop
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slidevert
}

# =====================================================
# SECTION 6.1: LIQUID GLASS
# =====================================================
# Two-pass preset with visible edge refraction, still bounded for the 540 Hz
# display. Fullscreen and media workloads are excluded below.
plugin:hyprglass {
    enabled = 1
    default_theme = dark
    default_preset = flow
    preset = name:flow, blur_strength:1.10, blur_iterations:2, refraction_strength:0.42, chromatic_aberration:0.18, fresnel_strength:0.46, specular_strength:0.52, glass_opacity:0.88, edge_thickness:0.045, lens_distortion:0.30
    preset = name:flow:dark, brightness:0.88, contrast:0.96, saturation:0.92, vibrancy:0.18, adaptive_dim:0.20

    layers {
        enabled = 1
        namespaces = waybar, dunst
        preset = flow
        namespace_mask_thresholds = waybar=0.05, dunst=0.05
    }
}

# =====================================================
# SECTION 7: LAYOUTS
# =====================================================

dwindle {
    preserve_split = true
    force_split = 2            # Always split to the right/bottom
}

master {
    new_status = master
}

# =====================================================
# SECTION 7.1: HY3 PLUGIN (i3-style tiling)
