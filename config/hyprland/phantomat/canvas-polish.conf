# Canvas polish: the group bar is drawn with the indicator pill, which the Phantomat canvas also draws,
# so tabs keep their fill in the canvas. Total bar height stays 42 px with the 8 px gap.
group {
    groupbar {
        gradients = false
        indicator_height = 30
        indicator_gap = 0
        height = 4
        text_offset = -17
    }
}
