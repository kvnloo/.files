# =====================================================
# PHANTOMAT (Hyprland plugin "spatialoverview") - legacy hyprlang config
# =====================================================
# NOT sourced by hyprland.legacy.conf / hyprland.conf. Nothing here is live
# until you add, at the very END of the live config (after the bindm lines,
# so $mod and the binds this file replaces already exist):
#
#   source = ~/workspace/.files/config/hyprland/phantomat/phantomat.legacy.conf
#
# and run `hyprctl reload`. To undo: remove that line, then
#   hyprctl plugin unload ~/.local/share/hyprland/plugins/phantomat/spatialoverview.so
#   hyprctl reload
#
# Built for Hyprland 0.56.2 (efb50993). The plugin refuses to load on any
# other Hyprland commit; rebuild first (see BUILD-INFO.txt next to the .so).
# UNVERIFIED: this file has never been parsed by a running Hyprland.
#
# Until SUPER + CTRL + G is pressed for the first time in a session the plugin
# only sits loaded: no canvas, your workspaces/dwindle/groups are untouched and
# every key below runs its original action. The first press creates the canvas
# and floats every window onto it (canvas:auto_float).

plugin = /home/kvn/.local/share/hyprland/plugins/phantomat/spatialoverview.so

bezier = spatialOverviewEase, 0.22, 1.0, 0.36, 1.0

plugin {
    spatialoverview {
        layout = grid
        scale = 0.36
        workspace_gap = 0

        animation {
            enabled = true
            speed = 8.0
            bezier = spatialOverviewEase
        }

        distortion {
            enabled = true
            strength = 0.14
            edge_scale = 1.08
            feather = 0.025
        }

        canvas {
            enabled = true
            desktop_mode = true
            persistent = true
            # true (upstream default) treats all outputs as one desk. This host
            # has a rotated DP-2 and at times a headless output; set false to
            # give each screen its own camera if the shared desk misbehaves.
            linked_screens = true
            places = false
            initial_zoom = 0.72
            min_zoom = 0.05
            max_zoom = 2.5
            zoom_step = 0.12
            auto_float = true
            auto_place = true
            placement_gap = 40
            space_pan = false
            direct_input = true
            hover_focus = true
            minimap_enabled = true
            grid_enabled = true
            grid_size = 80
            grid_style = 1
            background_dim = 0.35
            snap_enabled = true
            remember_layout = true
        }

        navigator {
            enabled = true
            labels = true
            pointer = true
            # follow the active border (pywal) instead of upstream's orange
            accent = auto
            mono_font = JetBrainsMono Nerd Font
        }

        parallax {
            enabled = true
            strength = 0.06
            depth = 0.12
            desktop = false
        }

        # Upstream animates Omarchy's bar/dock by exact layer namespace.
        # Noctalia's namespaces are per output (noctalia-bar-content-DP-1, ...),
        # which an exact match cannot cover, so this stays off.
        chrome_animation {
            enabled = false
        }

        wallpaper = 0
        blur = false
    }
}

# ---- keys -----------------------------------------------------------------

# The canvas: zoom out and search; again goes back. Free in the current binds
# (SUPER + G is hypr-group-workspace.sh, SUPER CTRL + G was unused).
bind = $mod CTRL, G, spatialoverview:overview, toggle all

# Three-finger swipe down was the one unused 3/4-finger direction.
# Note: unloading the plugin clears all trackpad gestures and reloads the
# config to restore the native ones.
spatialoverview-gesture = 3, down, overview

# Canvas-aware versions of existing keys: the plugin action while a canvas is
# open, the original dispatcher otherwise (scripts/phantomat-key).
$phantomat_key = $HOME/workspace/.files/scripts/phantomat-key

# Focus: nearest window that way, the camera follows.
unbind = $mod, H
unbind = $mod, J
unbind = $mod, K
unbind = $mod, L
unbind = $mod, left
unbind = $mod, down
unbind = $mod, up
unbind = $mod, right
bind = $mod, H, exec, $phantomat_key navigate left -- movefocus l
bind = $mod, J, exec, $phantomat_key navigate down -- movefocus d
bind = $mod, K, exec, $phantomat_key navigate up -- movefocus u
bind = $mod, L, exec, $phantomat_key navigate right -- movefocus r
bind = $mod, left, exec, $phantomat_key navigate left -- movefocus l
bind = $mod, down, exec, $phantomat_key navigate down -- movefocus d
bind = $mod, up, exec, $phantomat_key navigate up -- movefocus u
bind = $mod, right, exec, $phantomat_key navigate right -- movefocus r

# Move: nudge one grid step on the canvas (hold to repeat).
unbind = $mod SHIFT, H
unbind = $mod SHIFT, J
unbind = $mod SHIFT, K
unbind = $mod SHIFT, L
unbind = $mod SHIFT, left
unbind = $mod SHIFT, down
unbind = $mod SHIFT, up
unbind = $mod SHIFT, right
binde = $mod SHIFT, H, exec, $phantomat_key canvas nudge left -- movewindoworgroup l
binde = $mod SHIFT, J, exec, $phantomat_key canvas nudge down -- movewindoworgroup d
binde = $mod SHIFT, K, exec, $phantomat_key canvas nudge up -- movewindoworgroup u
binde = $mod SHIFT, L, exec, $phantomat_key canvas nudge right -- movewindoworgroup r
binde = $mod SHIFT, left, exec, $phantomat_key canvas nudge left -- movewindoworgroup l
binde = $mod SHIFT, down, exec, $phantomat_key canvas nudge down -- movewindoworgroup d
binde = $mod SHIFT, up, exec, $phantomat_key canvas nudge up -- movewindoworgroup u
binde = $mod SHIFT, right, exec, $phantomat_key canvas nudge right -- movewindoworgroup r

# Groups do nothing on the canvas: upstream notes that a group made there
# crashes Hyprland when it quits.
unbind = $mod, W
unbind = $mod, G
bind = $mod, W, exec, $phantomat_key canvas noop -- togglegroup
bind = $mod, G, exec, $phantomat_key canvas noop -- exec $HOME/workspace/.files/scripts/hypr-group-workspace.sh

# Workspaces do nothing on the canvas (canvas:places is off; it is experimental).
unbind = $mod, 1
unbind = $mod, 2
unbind = $mod, 3
unbind = $mod, 4
unbind = $mod, 5
unbind = $mod, 6
unbind = $mod, 7
unbind = $mod, 8
unbind = $mod, 9
unbind = $mod, 0
bind = $mod, 1, exec, $phantomat_key canvas noop -- workspace 1
bind = $mod, 2, exec, $phantomat_key canvas noop -- workspace 2
bind = $mod, 3, exec, $phantomat_key canvas noop -- workspace 3
bind = $mod, 4, exec, $phantomat_key canvas noop -- workspace 4
bind = $mod, 5, exec, $phantomat_key canvas noop -- workspace 5
bind = $mod, 6, exec, $phantomat_key canvas noop -- workspace 6
bind = $mod, 7, exec, $phantomat_key canvas noop -- workspace 7
bind = $mod, 8, exec, $phantomat_key canvas noop -- workspace 8
bind = $mod, 9, exec, $phantomat_key canvas noop -- workspace 9
bind = $mod, 0, exec, $phantomat_key canvas noop -- workspace 10
unbind = $mod SHIFT, 1
unbind = $mod SHIFT, 2
unbind = $mod SHIFT, 3
unbind = $mod SHIFT, 4
unbind = $mod SHIFT, 5
unbind = $mod SHIFT, 6
unbind = $mod SHIFT, 7
unbind = $mod SHIFT, 8
unbind = $mod SHIFT, 9
unbind = $mod SHIFT, 0
bind = $mod SHIFT, 1, exec, $phantomat_key canvas noop -- movetoworkspace 1
bind = $mod SHIFT, 2, exec, $phantomat_key canvas noop -- movetoworkspace 2
bind = $mod SHIFT, 3, exec, $phantomat_key canvas noop -- movetoworkspace 3
bind = $mod SHIFT, 4, exec, $phantomat_key canvas noop -- movetoworkspace 4
bind = $mod SHIFT, 5, exec, $phantomat_key canvas noop -- movetoworkspace 5
bind = $mod SHIFT, 6, exec, $phantomat_key canvas noop -- movetoworkspace 6
bind = $mod SHIFT, 7, exec, $phantomat_key canvas noop -- movetoworkspace 7
bind = $mod SHIFT, 8, exec, $phantomat_key canvas noop -- movetoworkspace 8
bind = $mod SHIFT, 9, exec, $phantomat_key canvas noop -- movetoworkspace 9
bind = $mod SHIFT, 0, exec, $phantomat_key canvas noop -- movetoworkspace 10

# New keys (both unused before). On the canvas: fill the screen / recent
# windows. Off it: toggle floating / cycle.
bind = $mod, T, exec, $phantomat_key canvas fill -- togglefloating
bind = ALT, Tab, exec, $phantomat_key canvas switch next -- cyclenext
bind = ALT SHIFT, Tab, exec, $phantomat_key canvas switch prev -- cyclenext prev

# Left as they are, and worth knowing on the canvas:
#   gesture = 3, horizontal, workspace   still swipes workspaces (cannot be made
#                                        canvas-aware in hyprlang); avoid it there
#   SUPER + minus / grave / 4-finger down   special workspaces, untested with the canvas
#   SUPER + F                            fullscreen: the plugin handles it per screen
#   SUPER + E / C / V                    dwindle keys, no effect on floating windows
# The live tuner (CTRL + , in the zoomed-out canvas) saves to
# ~/.config/hypr/spatialoverview-tuning.lua, which only a Lua config applies:
# under this legacy config tuned values last until the next reload.
