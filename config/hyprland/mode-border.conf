# Static example of the two-variable interface; this file is not auto-sourced.
# mode-border run writes the current values to ~/.cache/mode-border/colors.conf.
# A theme manager may read that generated file, or drive the watcher by atomically
# writing either/both variables to ~/.config/mode-border/override.conf.
# Input overrides preserve every Insert gradient stop/alpha/angle. Nav defaults
# to the same angle. Bad values are rejected; no arbitrary Hyprland commands.
# Default Insert below matches the current Noctalia-owned pywal theme gradient.
# This tracked example is never rewritten by the watcher. See its header for
# source precedence, colour maths, keyd degradation, theme settling and submaps.
$mode_insert_border = rgba(c8be72ff) rgba(c8be72ff) 90deg
$mode_nav_border = rgba(b0b3ffff) rgba(bfc2ffff) 90deg
