# groot: 23.4 GiB RAM, zram is the only swap (the NVMe swap file was retired 2026-10-23).
[zram0]
# Uncompressed capacity; RAM is only used as pages arrive.
zram-size = ram
# What actually matters: the compressed pool may hold at most half of RAM. At the
# measured ~2.25:1 zstd ratio that is ~26 GiB of swapped pages. Past it, swap-out
# fails and agent.slice's oomd stops the worst agent, instead of the desktop crawling.
zram-resident-limit = ram / 2
# zstd: ~2x the capacity of lz4 for ~2x the CPU per page. On 20 threads the extra
# decompression is a few percent of one core at the measured swap-in rate.
compression-algorithm = zstd
swap-priority = 200
options = discard
