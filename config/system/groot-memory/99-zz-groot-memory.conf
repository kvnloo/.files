# groot (23.4 GiB RAM, zram-only swap, many long-lived coding agents). Sorts last, so
# it wins over the older 99-custom / 99-performance-tuning / 99-z-memory-latency
# files, which disagreed with each other and were written for 16 GiB.
#
# Measured over 4.3 days before this change (/proc/vmstat):
#   workingset_refault_file 3.6e9 vs workingset_refault_anon 0.9e9
#     -> page cache was being evicted and re-read 4x more than swapped memory.
#   pgsteal_direct 4.7e9 vs pgsteal_kswapd 8.2e9
#     -> 36% of reclaim ran inside the allocating program (visible stalls).

# Swap to zram rather than dropping file cache. Kernel docs (sysctl/vm swappiness):
# values above 100 suit in-memory swap; zram swap-in is far cheaper than re-reading files.
vm.swappiness = 180
# zram has no seek cost; readahead on swap-in only wastes decompression.
vm.page-cluster = 0
# Wake kswapd earlier (2% of RAM gap instead of 1.25%) so background reclaim
# keeps ahead of allocations, instead of programs reclaiming for themselves.
vm.watermark_scale_factor = 200
vm.vfs_cache_pressure = 50
# Cap dirty page cache by bytes. The ratio settings in effect (20% / 10% of 23 GiB)
# let ~4.6 GiB of writes pile up and flush in one burst that stalls IO.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
