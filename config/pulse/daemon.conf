# PulseAudio Bit-Perfect Configuration for Topping DX5
# =====================================================
#
# This configuration enables bit-perfect audio playback by:
# - Avoiding resampling when possible
# - Using 24-bit sample format (optimal for DX5)
# - Setting appropriate sample rates for music playback
#
# Installation:
#   ln -sf /home/kvn/workspace/.files/config/pulse/daemon.conf ~/.config/pulse/daemon.conf
#   systemctl --user restart pulseaudio
#
# Verification:
#   pactl info
#   pacmd dump | grep avoid_resampling

# Sample format - 24-bit matches DX5 native format
default-sample-format = s24le

# Default sample rate - 44100 for CD quality / Spotify
# PulseAudio will use this unless source differs and avoid-resampling kicks in
default-sample-rate = 44100

# Alternate sample rate - 48000 for video content
# Allows switching between 44.1kHz and 48kHz families without resampling
alternate-sample-rate = 48000

# CRITICAL: Avoid resampling when source matches sink capabilities
# This is the key setting for bit-perfect playback
avoid-resampling = yes

# High-quality resampler for when resampling is unavoidable
# speex-float-10 is highest quality (0-10 scale)
resample-method = speex-float-10

# Stereo output (standard for music)
default-sample-channels = 2
default-channel-map = front-left,front-right

# Disable flat volumes (prevents unexpected volume jumps)
flat-volumes = no

# Realtime scheduling for lower latency
realtime-scheduling = yes
realtime-priority = 9

# High priority for audio daemon
high-priority = yes
nice-level = -11
