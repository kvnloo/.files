
# MBP is a light k3s agent on a local SATA SSD, not NVMe.
# Keep host counters at 1s while sampling pod/cgroup state less often.
# Retention is a target: whichever time/soft-size limit is reached first wins.
[db]
    dbengine tier 0 retention time = 3d
    dbengine tier 0 retention size = 512MiB
    dbengine tier 1 retention time = 1mo
    dbengine tier 1 retention size = 256MiB
    dbengine tier 2 retention time = 1y
    dbengine tier 2 retention size = 256MiB
    dbengine page cache size = 32MiB
    dbengine extent cache size = 16MiB

[plugins]
    apps = no
    tc = no

[plugin:cgroups]
    update every = 10

[web]
    web server threads = 2
