
# Groot: /var/cache/netdata must resolve to local NVMe storage.
# Time OR size evicts history first; quotas are soft dbengine targets, not
# filesystem hard limits. Reserve additional space for rotation/metadata.
[db]
    dbengine tier 0 retention time = 7d
    dbengine tier 0 retention size = 8GiB
    dbengine tier 1 retention time = 3mo
    dbengine tier 1 retention size = 2GiB
    dbengine tier 2 retention time = 1y
    dbengine tier 2 retention size = 1GiB
    dbengine page cache size = 64MiB
    dbengine extent cache size = 32MiB

[plugins]
    apps = yes

[plugin:cgroups]
    update every = 5
