# Linux PSI reports the proportion of time tasks stall, unlike disk busy time.
alarm: infrastructure_io_pressure
      on: system.io_some_pressure
   class: Latency
    type: System
component: Disk
  lookup: average -5m unaligned of *60
   units: %
   every: 30s
    warn: $this > (($status >= $WARNING) ? 10 : 20)
    crit: $this > (($status == $CRITICAL) ? 30 : 50)
   delay: up 2m down 5m
 summary: Sustained I/O pressure
    info: Tasks stalled on I/O, averaged over five minutes
      to: sysadmin

alarm: infrastructure_io_full_pressure
      on: system.io_full_pressure
   class: Latency
    type: System
component: Disk
  lookup: average -5m unaligned of *60
   units: %
   every: 30s
    warn: $this > (($status >= $WARNING) ? 5 : 10)
    crit: $this > (($status == $CRITICAL) ? 15 : 25)
   delay: up 2m down 5m
 summary: Sustained full I/O stall
    info: All non-idle tasks stalled on I/O, averaged over five minutes
      to: sysadmin

template: infrastructure_smart_failed
      on: smartctl.device_smart_status
   class: Errors
    type: System
component: Disk
  lookup: max -10m unaligned of failed
   units: status
   every: 1m
    crit: $this > 0
   delay: down 10m
 summary: Disk SMART health failure
    info: Device ${label:device_name} reports failed SMART health; inspect smartctl immediately
      to: sysadmin

template: infrastructure_smart_temperature
      on: smartctl.device_temperature
   class: Utilization
    type: System
component: Disk
  lookup: average -10m unaligned of temperature
   units: Celsius
   every: 1m
    warn: $this > (($status >= $WARNING) ? 55 : 60)
    crit: $this > (($status == $CRITICAL) ? 65 : 70)
   delay: up 2m down 10m
 summary: Disk temperature
    info: Sustained high temperature on ${label:device_name}
      to: sysadmin
