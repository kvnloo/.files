alarm: used_swap
      on: mem.swap
   class: Utilization
    type: System
component: Memory
    calc: ($used + $free > 0) ? ($used * 100 / ($used + $free)) : 0
   units: %
   every: 30s
    warn: $this > (($status >= $WARNING) ? 60 : 75)
    crit: $this > (($status == $CRITICAL) ? 80 : 90)
   delay: up 2m down 5m
 summary: System swap memory utilization
    info: Sustained swap utilization, including zram swap
      to: sysadmin

alarm: infrastructure_swapout
      on: mem.swapio
   class: Workload
    type: System
component: Memory
  lookup: average -5m unaligned absolute of out
   units: KiB/s
   every: 30s
    warn: $this > (($status >= $WARNING) ? 512 : 1024)
    crit: $this > (($status == $CRITICAL) ? 4096 : 8192)
   delay: up 1m down 5m
 summary: Sustained system swap-out traffic
    info: Average swap writes over five minutes; check memory pressure
      to: sysadmin
