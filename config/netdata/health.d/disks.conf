# Override packaged disks.conf to avoid duplicate capacity notifications.
template: disk_space_usage
      on: disk.space
   class: Utilization
    type: System
component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* *
    calc: ($avail + $used > 0) ? ($used * 100 / ($avail + $used)) : 0
   units: %
   every: 30s
    warn: $this > (($status >= $WARNING) ? 85 : 90)
    crit: $this > (($status == $CRITICAL) ? 92 : 97)
   delay: up 1m down 5m multiplier 1.5 max 15m
 summary: Disk ${label:mount_point} space usage
    info: Filesystem space utilization; dbengine quotas are soft targets
      to: sysadmin

template: disk_inode_usage
      on: disk.inodes
   class: Utilization
    type: System
component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* *
    calc: ($avail + $used > 0) ? ($used * 100 / ($avail + $used)) : 0
   units: %
   every: 1m
    warn: $this > (($status >= $WARNING) ? 85 : 90)
    crit: $this > (($status == $CRITICAL) ? 92 : 97)
   delay: up 1m down 5m
 summary: Disk ${label:mount_point} inode usage
    info: Filesystem inode utilization
      to: sysadmin
