[Unit]
Wants=netdata-desktop-notify.socket
After=netdata-desktop-notify.socket
RequiresMountsFor=/var/cache/netdata

[Service]
# Netdata 2.12 no longer implements the old [cloud] enabled switch.
# Stay unclaimed; block off-host IP traffic for daemon and every child plugin.
# This also prevents accidental Cloud/telemetry egress after a package update.
IPAddressDeny=any
IPAddressAllow=localhost
Environment=DISABLE_TELEMETRY=1 DO_NOT_TRACK=1
UnsetEnvironment=NETDATA_CLAIM_TOKEN NETDATA_CLAIM_ROOMS NETDATA_CLAIM_URL NETDATA_CLAIM_PROXY
Nice=19
IOSchedulingClass=idle
CPUWeight=10
IOWeight=10
