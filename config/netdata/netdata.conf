# Managed by scripts/setup-netdata.sh; Arch Netdata 2.x.
# Database resolution is per-chart: PSI is kernel-limited to 2s; SMART polls 5m.
# Ordinary host charts use 1s -> 60s -> 3600s tiers.
[global]
    run as user = netdata

[directories]
    cache = /var/cache/netdata

[db]
    db = dbengine
    update every = 1
    storage tiers = 3
    dbengine tier 1 update every iterations = 60
    dbengine tier 2 update every iterations = 60
    dbengine use all ram for caches = no

[web]
    bind to = 127.0.0.1:19999 [::1]:19999
    allow connections from = localhost 127.0.0.1 ::1
    allow connections by dns = no
    allow dashboard from = localhost 127.0.0.1 ::1
    allow dashboard by dns = no
    allow mcp from = localhost 127.0.0.1 ::1
    allow mcp by dns = no
    allow netdata.conf from = localhost 127.0.0.1 ::1
    allow management from = localhost 127.0.0.1 ::1
    respect do not track policy = yes

[health]
    enabled = yes
    script to execute on alarm = /usr/local/libexec/netdata-desktop-notify

[ml]
    enabled = no

[statsd]
    enabled = no

[registry]
    enabled = no

[plugins]
    proc = yes
    diskspace = yes
    cgroups = yes
    go.d = yes
    ebpf = no
    perf = no
    slabinfo = no
    debugfs = no
    freeipmi = no
    python.d = no
    charts.d = no
    idlejitter = no

[plugin:proc]
    /proc/pressure = yes

[plugin:proc:/proc/pressure]
    enable io some pressure = yes
    enable io full pressure = yes
