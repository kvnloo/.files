# Storage layout for groot. The root disk is 132G; bulk data lives elsewhere.
#
#   bind <path> <target> <service>...
#       Bind-mount <target> onto <path> via /etc/fstab. setup-storage.sh copies
#       any existing data first and stops <service>s while it does.
#   require <service> <path>
#       <service> waits for the mount that holds <path> at boot, so it never
#       writes into an empty mountpoint on the root disk.
#
# Docker uses the containerd image store, so images live under
# /var/lib/containerd even though Docker's data-root is on the big disk.
bind     /var/lib/containerd  /mnt/zer0models/containerd  containerd.service docker.service
require  containerd.service   /var/lib/containerd
require  docker.service       /mnt/zer0models/docker-data
require  docker.service       /var/lib/containerd
require  k3s.service          /workspace/k3s-data
