# ==============================================================================
# TMUX — persistent control plane for long-running agent fleets
# Prefix: Ctrl-Space (Ctrl-b remains available while muscle memory migrates)
# ==============================================================================

# Terminal fidelity and low-latency input
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB'
set -s escape-time 10
set -s focus-events on
set -s extended-keys on
# Never let tmux or pane OSC 52 sequences replace the desktop clipboard.
# Copy-mode `y` remains an explicit wl-copy action below.
set -g set-clipboard off
set -g mouse on
set -g history-limit 100000
set -g display-time 1500
set -g repeat-time 600

# Predictable numbering and safer session lifecycle
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'
setw -g remain-on-exit failed

# Preserve the historical macOS behavior without breaking Linux
if-shell 'command -v reattach-to-user-namespace >/dev/null 2>&1' \
  'set -g default-command "reattach-to-user-namespace -l /bin/zsh"'

# Vi-native command and copy modes
set -g status-keys vi
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# Reachable prefix with the default retained as a secondary prefix
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

# Configuration and pane lifecycle
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind R respawn-pane -k -c '#{pane_current_path}'
bind C-k send-keys -R \; clear-history \; display-message 'pane history cleared'

# Splits and windows always inherit the active pane's working directory
unbind '"'
unbind %
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# Hyprland/Zsh-consistent directional navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 5
bind Tab last-window
bind < swap-pane -U
bind > swap-pane -D

# Native hierarchy views plus purpose-built fleet popups
bind s choose-tree -Zs
bind w choose-tree -Zw
bind g display-popup -E -w 85% -h 85% -d '#{pane_current_path}' zsh
bind a display-popup -E -w 92% -h 86% -d '#{pane_current_path}' \
  "$HOME/workspace/.files/scripts/tmux-fleet-switcher.sh"
bind A display-popup -E -w 64% -h 62% -d '#{pane_current_path}' \
  "$HOME/workspace/.files/scripts/tmux-agent-launcher.sh"
# Keep both fleet controls inside tmux so fullscreen compositor focus cannot
# dismiss them before fzf or Agent Deck receives input.
bind F display-popup -E -w 96% -h 92% -d '#{pane_current_path}' \
  'env AGENTDECK_ALLOW_OUTER_TMUX=1 agent-deck'

# Activity is visible in the window list without stealing focus
setw -g monitor-activity on
set -g activity-action other
set -g bell-action any
set -g visual-activity off
set -g visual-bell off

# Tokyo Night glass palette — default backgrounds preserve Kitty transparency
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=#a9b1d6,bg=default'
set -g status-left-length 40
set -g status-right-length 120
set -g status-left '#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] 󰆍 #S #[fg=#7aa2f7,bg=default,nobold] '
set -g status-right '#{?client_prefix,#[fg=#e0af68]󰘳 PREFIX  ,}#[fg=#565f89]#{b:pane_current_path} #[fg=#7dcfff]· #{pane_current_command} #[fg=#565f89]· %H:%M '

setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W#F '
setw -g window-status-style 'fg=#565f89,bg=default'
setw -g window-status-current-format '#[fg=#24283b,bg=default]#[fg=#c0caf5,bg=#24283b,bold] #I:#W#{?window_zoomed_flag, 󰊓,} #[fg=#24283b,bg=default,nobold]'
setw -g window-status-activity-style 'fg=#e0af68,bg=default,bold'
setw -g window-status-bell-style 'fg=#f7768e,bg=default,bold'

set -g pane-border-style 'fg=#24283b'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g pane-border-status top
set -g pane-border-format ' #P · #{pane_current_command} · #{b:pane_current_path} '

set -g mode-style 'fg=#1a1b26,bg=#7aa2f7,bold'
set -g message-style 'fg=#c0caf5,bg=#24283b'
set -g message-command-style 'fg=#7dcfff,bg=#24283b'
set -g menu-style 'fg=#a9b1d6,bg=#1a1b26'
set -g menu-selected-style 'fg=#1a1b26,bg=#7aa2f7,bold'
set -g menu-border-style 'fg=#565f89'
set -g popup-style 'fg=#c0caf5,bg=#1a1b26'
set -g popup-border-style 'fg=#7aa2f7'
# pywal overrides the fallback palette above after each wallpaper change.
source-file -q ~/.cache/wal/colors-tmux.conf

# Privacy-safe semantic telemetry: record topology transitions, never keys,
# command arguments, pane output, or clipboard contents.
set-hook -g after-select-pane 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-select-pane #{pane_id}"'
set-hook -g after-select-window 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-select-window #{pane_id}"'
set-hook -g after-new-window 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-new-window #{pane_id}"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-split-window #{pane_id}"'
set-hook -g after-resize-pane 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-resize-pane #{pane_id}"'
set-hook -g after-rename-window 'run-shell -b "~/.local/bin/workspace-copilot record-tmux after-rename-window #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/workspace-copilot record-tmux client-session-changed #{pane_id}"'

# Crash/reboot persistence. TPM must run last: continuum injects its saver into
# status-right, and any later status-right assignment would silently disable it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @agent-fleet-key 'f'
# Keep the fleet selector inside tmux; external compositor windows can lose
# focus while a fullscreen client is active.
set -g @agent-fleet-launch-command ''
set -g @plugin 'kvnloo/tmux-agent-fleet'
set -g @resurrect-processes '"~claude->claude --continue" "~opencode->opencode --continue" "~codex->codex resume --last" "~omp->omp --continue"'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'

run-shell '~/.tmux/plugins/tpm/tpm'
