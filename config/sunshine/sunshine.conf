sunshine_name = groot-phone
capture = wlr
encoder = nvenc
# The virtual connector has a stable Wayland name, unlike its enumeration index.
output_name = PHONE
native_pen_touch = enabled
# Sunshine's packet dispatcher gates native pen events behind the mouse switch.
# Hyprland maps the resulting Pen passthrough tablet exclusively to PHONE.
mouse = enabled
keyboard = disabled
system_tray = disabled
upnp = disabled
address_family = both
origin_web_ui_allowed = lan
min_log_level = info
