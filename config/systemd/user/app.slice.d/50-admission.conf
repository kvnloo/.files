# INFRA-4 (2026-10-27): app.slice had no ceiling. It holds the indexers, dev servers,
# llama services and Dash metro (peak 15.0G RAM + 16.3G swap, 219 kills inside it).
# A ceiling turns its overload into an OOM inside app.slice instead of a global OOM
# that reaches the compositor. Sized above today's use (1.7G RAM + 6G swap) and above
# the sum of the largest children (llama 3G, GEPA 3G, agentsview 3.4G peaks).
# No MemoryHigh: throttling is the recorded livelock (8581e32, 00be955).
# Verified by scripts/memory-drift (group app).
# Rollback: remove this file, daemon-reload, then
# `systemctl --user set-property --runtime app.slice MemoryMax=infinity MemorySwapMax=infinity`.
[Slice]
MemoryMax=8G
MemorySwapMax=8G
