# The phone app's tailnet URL (:9119) must forward to this proxy (127.0.0.1:9165).
# Re-assert it on every start so a stale debug mapping can't outlive a restart.
# Leading '-': a tailscale hiccup must not fail the proxy itself.
[Service]
ExecStartPost=-/usr/bin/python3 %h/.local/bin/hermes-mobile-serve ensure --reason proxy-start
