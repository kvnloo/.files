# The gateway hosts every Hermes chat's agent loop and its foreground tool commands.
# It is a shared owner, so it gets a hard cap instead of agent.slice's oomd kill:
# a runaway tool child is OOM-killed inside this cgroup, and Restart=always brings the
# gateway back if the gateway itself is the victim. Sessions resume from state.db.
# Measured 2026-10-23 after 4 days: ~1.0G RSS + 1.1G swap.
[Service]
MemoryMax=5G
MemorySwapMax=1G
