# The gateway hosts every Hermes chat's agent loop and its foreground tool commands.
# It shares agent.slice's budget (14G RAM, 2G swap, oomd at 10% pressure for 20s)
# with the other coding agents instead of holding a separate 5G reservation on top
# of it. Trade-off: oomd stops the worst cgroup in the slice, and the gateway is one
# cgroup, so a runaway foreground tool command can take the whole gateway down.
# Restart=always brings it back and sessions resume from state.db. Background
# commands already run in their own systemd-run scopes.
# Measured 2026-10-24: ~3G RSS + 0.4G swap.
[Service]
Slice=agent.slice
