# The gateway hosts every Hermes chat's agent loop and its foreground tool commands.
# It shares agent.slice's budget (60-oomd-desktop-guard.conf: 10G RAM, 2G swap, no
# oomd pressure kill) with the other coding agents instead of holding a separate
# reservation on top of it. Background commands run in their own systemd-run scopes.
# Measured 2026-10-24: ~3G RSS + 0.4G swap.
[Service]
Slice=agent.slice
# The default OOMPolicy=stop turns one kernel-OOM-killed tool child into a stop of
# the whole gateway, i.e. every Hermes chat. continue: only the killed process dies.
OOMPolicy=continue
