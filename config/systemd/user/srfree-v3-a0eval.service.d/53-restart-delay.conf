# service.d/52-restart-backoff.conf caps RestartMaxDelaySec at 2 min, and systemd then clips any
# longer RestartSec down to that cap (2026-11-16: this unit restarted every 2 min, not every 15min).
# Sorting after 52 restores the declared delay; backoff still starts from RestartSec.
[Service]
RestartMaxDelaySec=15min
