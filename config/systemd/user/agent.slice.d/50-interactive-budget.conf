# Aggregate budget, including genuine GPU tools' supporting CPU work.
# CPU-only builds/tests/encode belong on fleet workers, not in this allowance.
[Slice]
CPUQuota=200%
CPUWeight=30
IOWeight=1
# The backing HDD uses mq-deadline: weights alone do not provide an I/O ceiling.
IOReadBandwidthMax=/dev/sdb2 8000000
IOWriteBandwidthMax=/dev/sdb2 4000000
MemoryHigh=8G
MemoryMax=14G
MemorySwapMax=8G
