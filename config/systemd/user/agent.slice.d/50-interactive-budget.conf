# Aggregate budget, including genuine GPU tools' supporting CPU work.
# CPU-only builds/tests/encode belong on fleet workers, not in this allowance.
[Slice]
CPUQuota=200%
CPUWeight=30
IOWeight=1
# sdb is an SSD (rotational=0), not an HDD. An 8/4 MB/s io.max cap on it held
# every agent tool and MCP server in IO stalls (PSI full ~40%). No bandwidth cap.
IOReadBandwidthMax=
IOWriteBandwidthMax=
# Memory and swap limits: 60-oomd-desktop-guard.conf is the only owner. A second
# MemoryMax here (14G vs 10G) silently lost on drop-in order and hid the real cap.
