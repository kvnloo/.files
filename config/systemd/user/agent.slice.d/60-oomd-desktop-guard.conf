# Keep the desktop responsive by stopping one process, never a whole agent harness.
#
# Why: on 2026-10-23 groot sat at 12-20% memory PSI (full) for long stretches with
# 38G in swap. systemd-oomd's defaults (60% pressure for 30s, 90% swap) never
# fired, and agents parked 7G in swap while the 14G MemoryMax held. Agents now
# start in their own scope under this slice (scripts/agent-launch), so
# their memory is charged here.
#
# 2026-10-24: oomd pressure kills (10% for 20s) on this slice killed five whole
# OMP scopes in 50 minutes (19:41, 19:55, 20:14, 20:29 twice; 71-226 processes
# each). systemd-oomd always kills a whole cgroup, and an agent's scope holds the
# harness, its in-process subagents and every tool it started, so every kill took
# the main harness with it. MemoryHigh=8G against the full 2G swap cap produced
# the sustained pressure. Now the hard limit decides: the kernel OOM killer picks
# one process, and scripts/agent-launch ranks every child of a harness above the
# harness itself (oom_score_adj), so tools and workers die first.
[Slice]
MemoryHigh=infinity
MemoryMax=10G
ManagedOOMPreference=none
# 2026-10-27 INFRA-1: 2G was pegged full (swap.peak == cap) and agent.slice took 470
# in-cgroup OOM kills. With the UI now protected (session.slice min, UI swap.max=0),
# batch is where reclaim should land, so agents may park cold pages in zram up to 4G.
# Rollback: set back to 2G here and redeploy.
MemorySwapMax=4G
ManagedOOMMemoryPressure=auto
