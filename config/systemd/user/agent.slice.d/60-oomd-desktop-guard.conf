# Keep the desktop responsive by stopping one agent, never by letting groot thrash.
#
# Why: on 2026-10-23 groot sat at 12-20% memory PSI (full) for long stretches with
# 38G in swap. systemd-oomd's defaults (60% pressure for 30s, 90% swap) never
# fired, and agents parked 7G in swap while the 14G MemoryMax held. Agents now
# start in their own scope under this slice (scripts/agent-launch), so
# their memory is charged here and oomd can stop the worst one.
[Slice]
MemoryHigh=8G
MemoryMax=10G
ManagedOOMPreference=none
# Agents may not hide their working set in swap. 2G covers cold pages of
# long sessions; anything beyond that is pressure the desktop pays for.
MemorySwapMax=2G
# systemd-oomd kills the descendant cgroup (one agent scope, one tool scope) with
# the most reclaim activity once this slice stays above 10% full pressure for 20s.
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=10%
ManagedOOMMemoryPressureDurationSec=20s
