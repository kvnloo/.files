# gnome-keyring leaks one eventfd per failed system prompt (gcr-prompter has no display
# under headless/background clients). At the default soft limit of 1024 the daemon can no
# longer open login.keyring, and every unlock fails with "Internal error" even with the
# right password (2026-10-19, 2026-11-10). A high limit turns that into years of headroom.
[Service]
LimitNOFILE=524288
