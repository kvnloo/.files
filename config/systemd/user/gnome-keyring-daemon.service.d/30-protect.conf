# Agents must not stop, restart or kill the login keyring (owner 2026-11-14).
# RefuseManualStop makes `systemctl --user stop|restart` fail for every caller,
# whatever harness it runs in; a killed daemon restarts and keyring-autounlock
# (BindsTo this unit) re-unlocks it. service-watch checks it stays unlocked.
# Owner override: remove this drop-in, `systemctl --user daemon-reload`.
[Unit]
RefuseManualStop=yes

[Service]
Restart=always
RestartSec=1
