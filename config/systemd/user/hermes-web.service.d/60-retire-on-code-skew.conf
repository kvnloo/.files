# hermes-skew-restart.timer restarts this backend after the live checkout moves (hermes update
# restarts only hermes-gateway*/serve*/dashboard* units). Restart=always also brings it back from a clean exit.
# Upholds: while this backend runs, systemd restarts the timer if anything stops it. A blanket
# "stop all timers" stopped it on 2026-11-11 and the dashboard then sat on stale code.
[Unit]
Upholds=hermes-skew-restart.timer

[Service]
Restart=always
