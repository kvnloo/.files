# Travel hardening (phone path). Dash pairing/token checks need this listener.
# Restart on any exit, never hit the start limit during a slow tailnet boot,
# and let the existing dash-wait-tailnet ExecStartPre use its full 100 s wait
# (the user manager default start timeout is shorter).
[Unit]
StartLimitIntervalSec=0
[Service]
Restart=always
TimeoutStartSec=2min
