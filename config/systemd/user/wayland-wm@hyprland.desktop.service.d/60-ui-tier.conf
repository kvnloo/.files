# INFRA-2 (2026-10-27): the compositor unit is UI. Its anon pages never go to zram.
# Reclaim protection comes from session.slice MemoryMin/Low (50-desktop-protection.conf).
# No MemoryMax here: a cap would end the session. Agents leave this unit through
# config/zsh/agent-scopes.zsh, so what stays here is Hyprland, Xwayland, the tern
# daemon and GUI, and idle pane shells.
# Verified by scripts/memory-drift (group ui). Rollback: remove this file, daemon-reload,
# then `systemctl --user set-property --runtime wayland-wm@hyprland.desktop.service MemorySwapMax=infinity`.
[Service]
MemorySwapMax=0
