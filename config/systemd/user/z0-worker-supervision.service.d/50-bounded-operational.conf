[Service]
# Existing supervision engine and timer, bounded operational projection only.
WorkingDirectory=/mnt/zer0models/worktrees/z0-supervisor-bounded-replay
Environment=PYTHONPATH=/mnt/zer0models/worktrees/z0-supervisor-bounded-replay/src
ExecStart=
ExecStart=/usr/bin/python3 -m z0int.fsm.supervise --operational-window 4000 --live-dir /mnt/zer0models/workspace/zer0/data/operations/fsm/live
Slice=agent.slice
CPUQuota=25%
IOWeight=1
IOReadBandwidthMax=/dev/sdb2 1000000
IOWriteBandwidthMax=/dev/sdb2 1000000
MemoryMax=512M
MemorySwapMax=128M
TimeoutStartSec=90
