# INFRA-2 (2026-10-27): fixed-size UI leaf. No swap; a ceiling so a leak cannot grow
# without bound under protection (UI-MEMORY-ROOT-CAUSE.md 7.4). Measured peak <= 51M;
# the unit restarts on failure. Verified by scripts/memory-drift (group ui).
[Service]
MemorySwapMax=0
# X2b 2026-11-07 (t_0c86492a): throttle at the old cap (MemoryHigh), hard stop at 1.5x.
MemoryHigh=256M
MemoryMax=384M
