[Service]
WorkingDirectory=%h/.local/lib/z0int-shadow/current
Environment=PYTHONPATH=%h/.local/lib/z0int-shadow/current/src
Environment=Z0INT_PYTHON=%h/.local/lib/z0int-shadow/current/.venv/bin/python
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=Z0INT_CLAUDE_PROJECTS_DIRS=%h/.claude-home/projects:%h/.claude-work/projects
ExecStart=
ExecStart=%h/.local/lib/z0int-shadow/current/.venv/bin/python -m z0int.cli loop tick --lock %h/.z0int/loop/quiet-lane.lock --lock-wait-s 30 --budget-s 600 --ledger %h/.z0int/loop/quiet-lane-ledger.jsonl
# The base unit treats exit 3 as success; clear it so DEGRADED is operationally visible.
SuccessExitStatus=
