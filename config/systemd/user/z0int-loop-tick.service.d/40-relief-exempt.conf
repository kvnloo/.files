# Kevin 2026-11-07 13:50 (t_15eaa9d7): exempt from agent-oom-guard relief (removed from
# agent_oom_policy.BATCH_UNIT), capped here so the tick cannot become the pressure source.
# MemoryHigh throttles and reclaims above 1.5G; there is no hard stop, so a tick slows instead
# of dying. Nice stays at the base unit's 19 (stricter than the approved 10). IO is
# best-effort 7, not idle: idle reads on sdb wait ~10 s each behind streaming jobs, which
# turned the 600 s budget into 10-60 min ticks (11-15; tests/test_idle_io_deadline.py).
[Service]
MemoryHigh=1536M
Nice=19
IOSchedulingClass=best-effort
IOSchedulingPriority=7
