# Travel hardening H8. Under memory pressure (CPUQuota=15%, idle IO) the
# watcher sends READY later than the default 90 s start timeout. Each timeout
# killed it, sent a failure report and restarted it (82 restarts on
# 2026-10-26). Give the start a longer budget. WatchdogSec still covers hangs.
[Service]
TimeoutStartSec=5min
