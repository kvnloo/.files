# Preserve desktop CPU/reclaim priority; replace ineffective mq-deadline IOWeight.
# Measured 2026-10-25: 6s O_DIRECT competing reads, p99 39.70 -> 17.81 ms.
# See docs/fleet/DESKTOP-ADMISSION.md (user layer); no bandwidth cap.
[Slice]
CPUWeight=1000
# Lifetime peak 5.91 GiB + ~18% margin; effective only with protected ancestor chain.
# memory.min protects reclaim, not immunity from global OOM victim selection.
MemoryMin=7G
MemoryLow=7G
MemoryHigh=infinity
IODeviceLatencyTargetSec=/dev/sdb 10ms
