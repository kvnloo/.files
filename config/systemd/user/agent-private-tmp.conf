# Drop-in for user units that host agents (t3code, tern-remote, hermes-gateway, ...).
# Their /tmp is a private, disk-backed dir instead of the host tmpfs, so agent
# scratch can never fill RAM-backed /tmp or reach other units. Installed and
# verified by scripts/agent-tmp-sandbox; aged by user-tmpfiles.d/agent-tmp.conf.
[Service]
PrivateUsers=self
BindPaths=%h/.cache/agent-tmp/%p:/tmp
Environment=TMPDIR=/tmp
