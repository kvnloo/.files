# Drop-in for user units that host agents (t3code, tern-remote, hermes-gateway, ...).
# Enforced by the kernel, not by agent obedience. `agent-tmp-sandbox verify` proves it by
# running escape attempts in a canary unit that carries this same file.
#   - /tmp is private and disk-backed (aged 2d); /dev/shm is private and capped.
#   - The filesystem is read-only except the allowlist below; each writable path has a
#     cleaner (agent-tmp aging, workspace-stale-cleanup, worktree reaping).
#   - Nothing outside the sandbox can be asked to write for it: the user bus, the systemd
#     socket and docker are hidden, and PrivateUsers drops the docker/wheel groups.
[Service]
PrivateUsers=self
BindPaths=%h/.cache/agent-tmp/%p:/tmp
Environment=TMPDIR=/tmp
TemporaryFileSystem=/dev/shm:size=512M,mode=1777
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-%h/workspace -%h/.cache -%h/.t3 -%h/.claude -%h/.claude.json -%h/.codex -%h/.hermes -%h/.ctx -%h/.no-mistakes
ReadWritePaths=-%h/.cargo -%h/.gradle -%h/.m2 -%h/go -%h/.npm -%h/.bun -%h/.android -%h/.local/share -%h/.local/state -%h/.kube
ReadWritePaths=-%t/tern
# Shell rc, units and bin are symlinks into the dotfiles checkout; keep it read-only too.
ReadOnlyPaths=-%h/workspace/.files
InaccessiblePaths=-%t/bus -%t/systemd -/run/docker.sock -/var/run/docker.sock -/run/dbus/system_bus_socket
