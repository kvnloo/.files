# o8's next-server grows ~1.2 GB/h of mostly cold memory and had no cap: it held 7.5 GiB
# (RAM + swap) when the kernel's global OOM killer fired at 2026-11-15 18:46 and the host went
# down. With a cap, the cgroup OOM kills next-server instead; o8's own supervisor restarts it
# (OOMPolicy=continue keeps this unit up), so a leak costs one ~30 s o8 restart, never the host.
[Service]
MemoryHigh=1G
MemoryMax=1536M
MemorySwapMax=2G
