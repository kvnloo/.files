# STAGED ONLY: parent owns the shared ctx restart and must verify the environment.
# ctx's ExecStart uses env -i, so Environment= alone would be silently discarded.
# Installed official binary recognizes CTX_CORE_PREPARATION_WORKERS and validates
# canonical unsigned decimal. Do not build a fork or add a new polling indexer.
[Service]
ExecStart=
ExecStart=/usr/bin/env -i CTX_CORE_PREPARATION_WORKERS=1 CTX_INTERNAL_SUPERVISOR_ENVIRONMENT_FILE=/mnt/zer0models/host-offload/home_kvn_.ctx/daemon/supervisor-environment.json /home/kvn/.local/bin/ctx --data-root /mnt/zer0models/host-offload/home_kvn_.ctx daemon run --format=json
