# Keep the generated ctx.service launch/environment contract intact.
# MemoryHigh reclaim throttling livelocks refreshes; retain a hard desktop budget.
[Unit]
StartLimitIntervalSec=15min
StartLimitBurst=3

[Service]
MemoryAccounting=yes
MemoryHigh=infinity
MemoryMax=5G
MemorySwapMax=2G
CPUWeight=10
IOWeight=10
Nice=10
IOSchedulingClass=idle
OOMPolicy=stop
Restart=on-failure
RestartSec=30s
RestartSteps=3
RestartMaxDelaySec=5min
