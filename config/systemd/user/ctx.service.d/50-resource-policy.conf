# Keep the generated ctx.service launch/environment contract intact.
# MemoryHigh reclaim throttling livelocks refreshes; retain a hard desktop budget.
# 2026-11-07: add MemoryHigh=4G (80% of 5G) so ctx reclaims before OOM kill.
# Crash-loop history: 100+ oom_memcg kills in 7 days.
[Unit]
StartLimitIntervalSec=15min
StartLimitBurst=3

[Service]
MemoryAccounting=yes
MemoryHigh=4G
MemoryMax=5G
MemorySwapMax=2G
CPUWeight=10
IOWeight=10
Nice=10
IOSchedulingClass=idle
OOMPolicy=stop
Restart=on-failure
RestartSec=30s
RestartSteps=3
RestartMaxDelaySec=5min