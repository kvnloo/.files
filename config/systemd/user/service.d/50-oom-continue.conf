# Top-level drop-in: applies to every user service.
# DefaultOOMPolicy=stop makes systemd stop a whole unit after the kernel OOM-kills any
# one process in it. The compositor unit holds Tern's daemon and every pane shell, the
# gateway holds every tool it runs: one tool's memory must not end every session.
# Owner rule 2026-10-25: subagents may be killed, never the root process.
[Service]
OOMPolicy=continue
