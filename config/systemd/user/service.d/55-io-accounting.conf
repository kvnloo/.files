# Top-level drop-in: every user service logs its disk IO when it stops
# ("Consumed ..., 403M read from disk"). Without it a dead unit's reads are only a slice total:
# on 2026-11-10 app.slice showed 16.5 TB read from sdb, 14.3 TB of it from cgroups that no longer
# existed, and nothing named the reader. Accounting only: no weight, no cap.
[Service]
IOAccounting=yes
