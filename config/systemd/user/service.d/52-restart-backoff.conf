# 2026-11-15 class fix (recurring F9/F16/F20 restart storms): any looping user unit backs off from its
# RestartSec to 2 min over 5 restarts instead of restarting every 5 s forever (z0bridge-identity hit 593/h,
# z0intelligence 118/h). Units keep Restart=; a deliberate start resets the counter.
[Service]
RestartSteps=5
RestartMaxDelaySec=2min
