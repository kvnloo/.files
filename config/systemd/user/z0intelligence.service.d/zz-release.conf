# Source and interpreter follow the single content-stamped release reference.
# Keep the established credential loader, binds and readiness publication.
[Service]
WorkingDirectory=
WorkingDirectory=%h/.local/lib/z0int-shadow/current
Environment=PYTHONPATH=%h/.local/lib/z0int-shadow/current/src:%h/zer0/oss/hermes-jev-skills
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=Z0INT_PYTHON=%h/.local/lib/z0int-shadow/current/.venv/bin/python
ExecStart=
ExecStart=%h/.local/lib/z0int-shadow/current/.venv/bin/python /mnt/zer0models/workspace/zer0/oss/tools/dsh-env-exec.py --allow GROQ_API_KEY --allow CEREBRAS_API_KEY --allow DEEPSEEK_API_KEY --allow OPENROUTER_API_KEY --allow AI_GATEWAY_API_KEY --allow NVIDIA_API_KEY -- %h/.local/lib/z0int-shadow/current/.venv/bin/python -m z0int.intelligence_service --bind 127.0.0.1 --bind 172.19.0.1 --port 11501
ExecStartPost=
ExecStartPost=%h/.local/lib/z0int-shadow/current/.venv/bin/python %h/.local/lib/z0int-shadow/current/scripts/intelligence-readiness.py ready
ExecStopPost=
ExecStopPost=%h/.local/lib/z0int-shadow/current/.venv/bin/python %h/.local/lib/z0int-shadow/current/scripts/intelligence-readiness.py not-ready
