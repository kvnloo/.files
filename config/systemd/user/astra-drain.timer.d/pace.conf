[Timer]
# 11-11: codex under-burn (pace 0.19, 33% perishing); burn-gate codex still gates each run.
OnUnitInactiveSec=
# F16 2026-11-16: 2 min -> 10 min. astra-drain.path now picks up enqueues at once; this is the backstop
# for burn-gate refusals and for the next job of a backlog (writes made during a run do not fire the path).
OnUnitInactiveSec=10min
# F0 11-13: the empty OnUnitInactiveSec= above resets every trigger of the base unit, so nothing re-arms the timer
# after a boot or restart until the service has run once. OnBootSec (not OnActiveSec, which every
# daemon-reload re-fires) elapses at once when the timer starts after boot, and never again.
OnBootSec=1min
