# Prefix drop-in: applies to future hermes-worker-*.scope, NOT Hermes core.
# Local tool shells enter the envelope at launch; no process-name sweeping.
[Scope]
Slice=agent.slice
CPUAccounting=yes
CPUQuota=100%
CPUWeight=10
IOAccounting=yes
IOWeight=1
MemoryAccounting=yes
MemoryHigh=2G
MemoryMax=4G
MemorySwapMax=512M
TasksMax=512
