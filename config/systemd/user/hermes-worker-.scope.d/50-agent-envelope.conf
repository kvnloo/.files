# Prefix drop-in: applies to future hermes-worker-*.scope, NOT Hermes core.
# Local tool shells enter the envelope at launch; no process-name sweeping.
[Scope]
Slice=agent.slice
CPUQuota=100%
CPUWeight=10
IOWeight=1
# No MemoryHigh: below MemoryMax it only throttles, so an over-budget job
# livelocks for hours (a Blender probe sat at 2G for 17h). Hit the hard
# limit and fail fast with an OOM kill the owner can see.
MemoryHigh=infinity
MemoryMax=4G
MemorySwapMax=512M
TasksMax=512
# Backstop for forgotten background jobs. Long-lived servers belong in a
# real systemd unit, not a tool scope.
RuntimeMaxSec=8h
