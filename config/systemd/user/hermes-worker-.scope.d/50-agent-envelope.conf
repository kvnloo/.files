# Prefix drop-in: applies to future hermes-worker-*.scope, NOT Hermes core.
# Local tool shells enter the envelope at launch; no process-name sweeping.
[Scope]
Slice=agent.slice
CPUQuota=100%
CPUWeight=10
IOWeight=1
# X2b 2026-11-07 (t_0c86492a, ayo): throttle agent workers, don't kill them. MemoryHigh
# reclaims at the old 4G cap; the hard stop is 6G. The 2026-10 livelock (a Blender probe
# sat at 2G for 17h under MemoryHigh) is bounded by RuntimeMaxSec=8h below and by the
# 2G gap to MemoryMax, so an over-budget job still ends in a visible OOM kill.
MemoryHigh=4G
MemoryMax=6G
MemorySwapMax=512M
TasksMax=512
# Backstop for forgotten background jobs. Long-lived servers belong in a
# real systemd unit, not a tool scope.
RuntimeMaxSec=8h
