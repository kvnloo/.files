# 2026-10-26 memory lane: the refresh daemon (peak ~3.9G anon) runs inside this unit; cap it so a refresh cannot push
# groot into a global OOM (14:08 and 14:45 storms). MemoryHigh is not used (ctx: reclaim throttling livelocks refreshes).
# Never start while agentsview-sync runs.
#
# memory-heal 2026-11-02 (moved into .files; was hand-written live): the old ">= 6 GiB available" gate never opened
# on groot (MemAvailable 3-5 GiB), so ctx went 7 days without a refresh. The OOM risk it guarded against is now bounded
# by the cap plus kill order: OOMScoreAdjust=900 (agent-oom-guard's batch class) makes this job the first one the kernel
# kills, ahead of the desktop and agents. The gate is the cap plus 512 MiB of headroom.
[Service]
MemoryMax=4G
MemorySwapMax=1G
OOMScoreAdjust=900
ExecCondition=
ExecCondition=/usr/bin/awk '/^MemAvailable:/ { exit !($2 > 4718592) }' /proc/meminfo
ExecCondition=/home/kvn/.local/bin/memory-index-idle
