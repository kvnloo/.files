# 2026-10-26 memory lane: the refresh daemon (peak ~3.9G anon) runs inside this unit; cap it so a refresh cannot push
# groot into a global OOM (14:08 and 14:45 storms). MemoryHigh is not used (ctx: reclaim throttling livelocks refreshes).
# Start only with >= 6 GiB available and never while agentsview-sync runs.
#
# memory-heal 2026-11-02: moved into .files unchanged in effect. A same-day experiment lowered the gate to 4.5 GiB with
# OOMScoreAdjust=900; it reproduced the global OOM storms (211 kernel OOM kills 19:03-19:45, clustered on every ctx-import
# start: the cap bounds ctx, not the host), so the 6 GiB gate is restored. ctx freshness needs a different home
# (off-peak window or another host), not a lower gate.
[Service]
MemoryMax=4G
MemorySwapMax=1G
ExecCondition=
ExecCondition=/usr/bin/awk '/^MemAvailable:/ { exit !($2 > 6291456) }' /proc/meminfo
ExecCondition=/home/kvn/.local/bin/memory-index-idle
