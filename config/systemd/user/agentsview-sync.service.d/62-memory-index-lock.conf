# 2026-10-26 memory lane: agentsview-sync (now incl. the mbp SSH pull) and ctx-import each peak at GBs;
# overlapping at 14:08 they pushed groot into a global OOM storm. One exclusive memory-index lock serializes them;
# a run that cannot get it within 10 min skips quietly (-E 0). Revert: delete this file.
# 2026-11-05 reliability (R20 #4): ctx-import holds the lock ~45 min per run every 15 min, so a 10 min wait
# skipped 23 of 35 syncs in 24 h and AgentsView fell 7-103 h behind. Wait up to 40 min (TimeoutStartSec 50 min);
# kernel flock wakes this waiter when ctx-import exits, before ctx-import's next timer start. Revert: git revert.
[Service]
ExecStart=
ExecStart=/usr/bin/flock -x -w 2400 -E 0 /mnt/zer0models/cua-lane-tmp/locks/memory-index.lock /usr/bin/flock -s -w 60 -E 0 /mnt/zer0models/cua-lane-tmp/locks/quiet-lane.lock /home/kvn/.local/bin/agentsview sync
